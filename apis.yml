    Manage stock levels for each product variant (e.g. size or color) and temporarily hold stock while
    an AI agent completes a checkout. Each hold can later be confirmed or cancelled, and automatically
    expires on its own if left unresolved. This prevents overselling, even when multiple agents are buying
