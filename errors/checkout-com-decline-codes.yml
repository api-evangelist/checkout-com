method: searched
source: https://www.checkout.com/docs/developer-resources/codes/api-response-codes
description: >-
  Checkout.com's payment response-code taxonomy — the five-digit response_code
  the API returns on a payment, payout, or refund. Distinct from API-level HTTP
  errors: on a successful 2xx that is nonetheless declined, the payment body
  carries approved:false, status:"Declined", and this response_code (e.g.
  "20051"). Codes are grouped by range: 10xxx approved, 20xxx soft declines
  (retry may succeed), 30xxx hard declines (issuer/cardholder must fix first),
  4xxxx risk responses (from Fraud Detection risk strategies), 50xxx payout and
  refund declines. Captured verbatim from the API response codes reference.
docs:
  - https://www.checkout.com/docs/developer-resources/codes/api-response-codes
  - https://www.checkout.com/docs/developer-resources/codes/error-codes
  - https://www.checkout.com/docs/developer-resources/codes/issuing-decline-codes
envelope_field: response_code   # on the payment/payout/refund body when approved == false
ranges:
  - {range: 10xxx, type: approved, description: The payment request was successful.}
  - {range: 20xxx, type: soft decline, description: Declined, though subsequent attempts may succeed.}
  - {range: 30xxx, type: hard decline, description: Declined; most require the issuer or cardholder to fix an issue before retry.}
  - {range: 4xxxx, type: risk response, description: The request raised a risk response; response_code and status depend on your Fraud Detection risk strategy action.}
  - {range: 50xxx, type: payout/refund decline, description: Checkout.com declined the payout or refund request.}
most_common:
  - {code: '20005', meaning: Declined - Do not honour, note: The most common bank authorization decline; the issuer gives no further detail and Checkout.com cannot override it.}
