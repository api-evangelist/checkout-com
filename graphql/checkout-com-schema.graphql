# ─── Query Root ───────────────────────────────────────────────────────────────

type Query {
  "Get a payment by ID"
  payment(id: ID!): Payment

  "List payments with optional filters"
  payments(filters: PaymentFiltersInput): PaginatedPayments

  "Get payment actions for a payment"
  paymentActions(paymentId: ID!): [PaymentAction]

  "Get a payout by ID"
  payout(id: ID!): Payout

  "List payouts"
  payouts(limit: Int, skip: Int): PaginatedPayouts

  "Get an instrument by ID"
  instrument(id: ID!): Instrument

  "List instruments for a customer"
  instruments(customerId: ID!): PaginatedInstruments

  "Get a customer by ID"
  customer(id: ID!): Customer

  "Get a dispute by ID"
  dispute(id: ID!): Dispute

  "List disputes with optional filters"
  disputes(filters: DisputeFiltersInput): PaginatedDisputes

  "Get dispute evidence for a dispute"
  disputeEvidence(disputeId: ID!): DisputeEvidence

  "Get a payment session by ID"
  paymentSession(id: ID!): PaymentSession

  "Get a payment link by ID"
  paymentLink(id: ID!): PaymentLink

  "Get a webhook by ID"
  webhook(id: ID!): Webhook

  "List webhooks"
  webhooks: PaginatedWebhooks

  "Get a webhook event by ID"
  webhookEvent(id: ID!): WebhookEvent

  "Get a network token by ID"
  networkToken(id: ID!): NetworkToken

  "Get a forex rate"
  forexRate(input: ForexRateInput!): ForexRate

  "Get a transfer by ID"
  transfer(id: ID!): Transfer

  "Get balances for an entity"
  balances(entityId: String!, currency: Currency): [Balance]

  "Get a report by ID"
  report(id: ID!): Report

  "List reports"
  reports(from: DateTime, to: DateTime, limit: Int): [Report]

  "List financial actions"
  financialActions(from: DateTime!, to: DateTime!, paymentId: ID, actionId: ID, limit: Int, skip: Int): [FinancialAction]

  "Get an issuing cardholder by ID"
  cardholder(id: ID!): Cardholder

  "List cardholders"
  cardholders(limit: Int, skip: Int): [Cardholder]

  "Get an issuing card by ID"
  issuingCard(id: ID!): IssuingCard

  "List issuing cards for a cardholder"
  issuingCards(cardholderId: ID, limit: Int, skip: Int): [IssuingCard]
}

# ─── Mutation Root ────────────────────────────────────────────────────────────

type Mutation {
  "Request a payment or card verification"
  createPayment(input: CreatePaymentInput!): Payment

  "Capture an authorized payment"
  capturePayment(id: ID!, input: CapturePaymentInput): CaptureResponse

  "Refund a captured payment"
  refundPayment(id: ID!, input: RefundPaymentInput): RefundResponse

  "Void an authorized payment"
  voidPayment(id: ID!, input: VoidPaymentInput): VoidResponse

  "Request a payout"
  createPayout(input: CreatePayoutInput!): Payout

  "Store a payment instrument"
  createInstrument(input: CreateInstrumentInput!): Instrument

  "Update a stored instrument"
  updateInstrument(id: ID!, input: UpdateInstrumentInput!): Instrument

  "Delete a stored instrument"
  deleteInstrument(id: ID!): Boolean

  "Create a payment session"
  createPaymentSession(input: CreatePaymentSessionInput!): PaymentSession

  "Create a payment link"
  createPaymentLink(input: CreatePaymentLinkInput!): PaymentLink

  "Submit evidence for a dispute"
  submitDisputeEvidence(id: ID!, input: SubmitDisputeEvidenceInput!): Boolean

  "Accept a dispute"
  acceptDispute(id: ID!): Boolean

  "Tokenize a card or wallet"
  createToken(input: CreateTokenInput!): Token

  "Register a webhook"
  createWebhook(input: CreateWebhookInput!): Webhook

  "Update a webhook"
  updateWebhook(id: ID!, input: UpdateWebhookInput!): Webhook

  "Remove a webhook"
  deleteWebhook(id: ID!): Boolean

  "Create a transfer between entities"
  createTransfer(input: CreateTransferInput!): Transfer

  "Request a report"
  createReport(input: ReportInput!): Report

  "Create an issuing cardholder"
  createCardholder(input: CreateCardholderInput!): Cardholder

  "Issue a new card"
  createIssuingCard(input: CreateIssuingCardInput!): IssuingCard

  "Update an issuing card status"
  updateIssuingCardStatus(id: ID!, status: IssuingCardStatus!): IssuingCard

  "Revoke an issuing card"
  revokeIssuingCard(id: ID!): Boolean
}
