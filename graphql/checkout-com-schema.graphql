"""
Checkout.com GraphQL Schema
Derived from the Checkout.com REST API covering payments, payouts, sessions,
instruments, disputes, tokenization, issuing, forex, and reporting.
"""

# ─── Scalars ──────────────────────────────────────────────────────────────────

scalar DateTime
scalar JSON
scalar Long

# ─── Enums ────────────────────────────────────────────────────────────────────

enum PaymentStatus {
  PENDING
  AUTHORIZED
  CARD_VERIFIED
  VOIDED
  PARTIALLY_CAPTURED
  CAPTURED
  PARTIALLY_REFUNDED
  REFUNDED
  DECLINED
  CANCELED
  EXPIRED
  PAID
}

enum PaymentAction {
  AUTHORIZATION
  CAPTURE
  REFUND
  VOID
  PAYOUT
  CARD_VERIFICATION
}

enum Currency {
  USD
  EUR
  GBP
  AUD
  CAD
  CHF
  HKD
  JPY
  SGD
  AED
  INR
  BRL
  MXN
  NOK
  SEK
  DKK
  PLN
  CZK
  HUF
  NZD
}

enum PaymentMethodType {
  CARD
  TOKEN
  NETWORK_TOKEN
  APPLE_PAY
  GOOGLE_PAY
  KLARNA
  SOFORT
  SEPA
  IDEAL
  PAYPAL
  ALIPAY
  WECHAT_PAY
  GIROPAY
  BOLETO
  OXXO
  BANK_TRANSFER
}

enum CardScheme {
  VISA
  MASTERCARD
  AMEX
  DISCOVER
  DINERS
  JCB
  UNIONPAY
  MAESTRO
}

enum CardType {
  CREDIT
  DEBIT
  PREPAID
  CHARGE
}

enum ThreeDsVersion {
  V1
  V2
}

enum ThreeDsAuthResult {
  Y
  N
  A
  D
  U
  R
  C
  I
}

enum DisputeStatus {
  EVIDENCE_REQUIRED
  EVIDENCE_UNDER_REVIEW
  RESOLVED
  WON
  LOST
  CANCELED
  EXPIRED
  ACCEPTED
}

enum DisputeCategory {
  FRAUDULENT
