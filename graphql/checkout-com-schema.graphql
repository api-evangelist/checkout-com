}

enum EventType {
  PAYMENT_APPROVED
  PAYMENT_PENDING
  PAYMENT_DECLINED
  PAYMENT_EXPIRED
  PAYMENT_CANCELED
  PAYMENT_VOIDED
  PAYMENT_CAPTURE_PENDING
  PAYMENT_CAPTURED
  PAYMENT_REFUND_PENDING
  PAYMENT_REFUNDED
  PAYMENT_CHARGEBACK
  DISPUTE_EVIDENCE_REQUIRED
  DISPUTE_RESOLVED
  PAYOUT_PAID
  PAYOUT_DECLINED
}

enum SessionStatus {
  ACTIVE
  COMPLETED
  EXPIRED
}

enum IssuingCardStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
  REVOKED
}

enum IssuingCardType {
  PHYSICAL
  VIRTUAL
}

enum ReportFormat {
  CSV
  JSON
}

enum TokenType {
  APPLEPAY
  GOOGLEPAY
  CARD
  NETWORK_TOKEN
}

enum VerificationStatus {
  APPROVED
  DECLINED
  PENDING
}

enum WebhookStatus {
  ACTIVE
  INACTIVE
}

enum ProcessingChannel {
  NAS
  ABC
}

