openapi: 3.2.0
info:
  title: Checkout.com API Reference Card testing API
  description: '## Get started

    Checkout.com provides a collection of APIs that enable you to integrate with our various products and services.

    Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using any HTTP or REST library.

    Sign up for a test account to gain access to the sandbox environment, where you can test API calls without affecting live data.

    For more information, see:


    - API endpoints

    - API rate limits

    - API changes

    - Idempotency

    - Private connections


    ## Base URLs

    The base URLs you must use for your API calls to the sandbox and production environments are unique to you.


    - `https://{prefix}.api.sandbox.checkout.com/{path}`

    - `https://{prefix}.api.checkout.com/{path}`

    - `https://{prefix}.access.sandbox.checkout.com/{path}`

    - `https://{prefix}.access.checkout.com/{path}`


    The unique API endpoint host names resolve to Checkout.com''s IP addresses. Do not allowlist these IP addresses.

    The `{prefix}` value in each base URL is a string containing the first eight characters of each of your environments'' unique `client_id`, excluding the `cli_` prefix.

    To find your unique base URL:

    1. Sign in to the Dashboard environment you want to retrieve the base URL for:


    - Sandbox

    - Production


    2. Go to _Developers_ > _Overview_.

    Your unique base URL is displayed on the _Developer overview_ page. For example, `https://vkuhvk4v.api.checkout.com`.


    3. Alternatively, go to _Settings_ > _Account details_.

    Your unique base URL is displayed under _Connection settings_.


    If you are unsure of your client ID or base URL for either environment, contact your account manager or request support.

    For more information, see API endpoints.

    ## Authentication

    When you sign up for an account, you can authenticate with either Access keys (OAuth 2.0), or Secret API keys.

    Unless explicitly stated, all endpoints require authentication using either your Access or Secret API Keys. Public keys should only be used in JavaScript or native applications.


    - **Client-side authentication**. Use your public key for client-side authentication. It only has access to a limited set of our APIs – mostly those called as part of your payment environment.


    - **Server-to-server authentication**. Use your secret key or OAuth for server-to-server communication. Support for API keys depends on the endpoint.


    Never share your OAuth credentials, API keys, or access tokens. Keep them guarded and secure.'
  termsOfService: https://www.checkout.com/legal/terms-and-policies
  contact:
    name: Checkout.com Support
    url: https://dashboard.checkout.com/support
  version: v1.0.0
servers:
- url: https://{prefix}.api.sandbox.checkout.com
  description: Sandbox environment
  variables:
    prefix:
      default: '{prefix}'
      description: Your unique <a href="https://www.checkout.com/docs/developer-resources/api/api-endpoints" target="_blank">base URL</a>. There is no default value.
- url: https://{prefix}.api.checkout.com
  description: Production environment
  variables:
    prefix:
      default: '{prefix}'
      description: Your unique <a href="https://www.checkout.com/docs/developer-resources/api/api-endpoints" target="_blank">base URL</a>. There is no default value.
tags:
- name: Card testing
  description: Simulate transactions using a card on the sandbox environment.
paths:
  /issuing/simulate/authorizations:
    post:
      tags:
      - Card testing
      summary: Simulate authorization
      description: Simulate an authorization request with a card you issued previously.
      operationId: simulateAuthorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateAuthorizationRequest'
            examples:
              Purchase - Authorization:
                value:
                  card:
                    id: crd_fa6psq242dcd6fdn5gifcq1491
                    expiry_month: 5
                    expiry_year: 2025
                  transaction:
                    type: purchase
                    amount: 2500
                    currency: GBP
                    merchant:
                      category_code: 7399
              Purchase - Pre-authorization:
                value:
                  card:
                    id: crd_fa6psq242dcd6fdn5gifcq1491
                    expiry_month: 5
                    expiry_year: 2025
                  transaction:
                    type: purchase
                    amount: 2500
                    currency: GBP
                    merchant:
                      category_code: 7399
                    authorization_type: pre_authorization
        required: true
      responses:
        '201':
          description: Authorization processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateAuthorizationResponse'
        '401':
          description: Unauthorized
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:transactions-write
  /issuing/simulate/authorizations/{id}/authorizations:
    post:
      tags:
      - Card testing
      summary: Simulate incrementing an authorization
      description: 'Simulate an incremental authorization request for an existing approved transaction.


        Incremental authorizations increase the total authorized amount of the transaction. For example, adding a restaurant bill to an existing hotel booking.'
      operationId: simulateIncrementalAuthorization
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingTransactionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateIncrementalAuthorizationRequest'
        required: true
      responses:
        '201':
          description: Authorization processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateIncrementalAuthorizationResponse'
        '401':
          description: Unauthorized
        '404':
          description: Authorization not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:transactions-write
  /issuing/simulate/authorizations/{id}/presentments:
    post:
      tags:
      - Card testing
      summary: Simulate clearing
      description: Simulate the clearing of an existing approved authorization.
      operationId: simulatePresentment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingTransactionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentmentRequest'
        required: true
      responses:
        '202':
          description: Presentment accepted
        '401':
          description: Unauthorized
        '404':
          description: Authorization not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:transactions-write
  /issuing/simulate/authorizations/{id}/refunds:
    post:
      tags:
      - Card testing
      summary: Simulate refund
      description: Simulate the refund of an existing approved authorization, after it has been cleared.
      operationId: simulateRefund
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingTransactionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRefundRequest'
        required: true
      responses:
        '202':
          description: Refund accepted
        '401':
          description: Unauthorized
        '404':
          description: Presentment not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:transactions-write
  /issuing/simulate/authorizations/{id}/reversals:
    post:
      tags:
      - Card testing
      summary: Simulate reversal
      description: Simulate the reversal of an existing approved authorization.
      operationId: simulateReversal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingTransactionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversalRequest'
        required: true
      responses:
        '201':
          description: Reversal processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReversalResponse'
        '401':
          description: Unauthorized
        '404':
          description: Authorization not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:transactions-write
components:
  schemas:
    ReversalRequest:
      type: object
      properties:
        amount:
          minimum: 0
          type: integer
          description: 'The amount to reverse. If unspecified, the full transaction amount will be reversed.


            You must provide the amount in the transaction currency''s <a href="https://www.checkout.com/docs/resources/calculating-the-amount" target="blank">minor currency units</a>.

            '
          example: 2500
    ExpiryYear:
      maxLength: 4
      minLength: 4
      type: integer
      description: The card's expiration year.
      format: int32
      example: 2025
    SimulateIncrementalAuthorizationRequest:
      type: object
      properties:
        amount:
          minimum: 0
          type: integer
          description: 'You must provide the amount in the transaction currency''s <a href="https://www.checkout.com/docs/resources/calculating-the-amount" target="blank">minor currency units</a>.

            '
          example: 3500
    ReversalResponse:
      required:
      - status
      type: object
      properties:
        status:
          enum:
          - Reversed
          - Declined
          type: string
          description: The status of the transaction (either Reversed or Declined).
          example: Reversed
      description: Reversal Response.
    IssuingMerchant:
      type: object
      properties:
        category_code:
          maxLength: 4
          minLength: 4
          type: string
          description: 'The <a href="https://www.checkout.com/docs/resources/codes/merchant-category-codes" target="blank">merchant category code (MCC)</a>, which determines the types of businesses the card can process the transaction from.

            '
          example: '7399'
      description: The merchant related data to use for the transaction.
    IssuingCardId:
      maxLength: 30
      minLength: 30
      pattern: ^crd_[a-z0-9]{26}$
      type: string
      description: The card's unique identifier.
      example: crd_fa6psq242dcd6fdn5gifcq1491
    SimulateIncrementalAuthorizationResponse:
      required:
      - status
      type: object
      properties:
        status:
          enum:
          - Authorized
          - Declined
          type: string
          description: The transaction's status.
          example: Authorized
      description: Authorization Response.
    IssuingSimulateCard:
      required:
      - id
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IssuingCardId'
        expiry_month:
          $ref: '#/components/schemas/ExpiryMonth'
        expiry_year:
          $ref: '#/components/schemas/ExpiryYear'
      description: The card to simulate an authorization with.
    SimulateAuthorizationRequest:
      type: object
      properties:
        card:
          $ref: '#/components/schemas/IssuingSimulateCard'
        transaction:
          $ref: '#/components/schemas/IssuingSimulateTransaction'
    Purchase:
      title: purchase
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: 'The transaction type.

            '
          example: purchase
        amount:
          minimum: 0
          type: integer
          description: 'The payment amount, in <a href="https://www.checkout.com/docs/resources/calculating-the-amount" target="blank">minor currency units</a>.


            To perform a card verification, set `amount` to `0`, or omit the field entirely.

            '
          example: 6540
        currency:
          maxLength: 3
          minLength: 3
          type: string
          description: The currency to use for the transaction, as a three-letter <a href="https://www.checkout.com/docs/resources/codes/currency-codes" target="blank">ISO currency code</a>. If this currency differs from the cardholder's billing currency, the billing amount will be adjusted according to the applicable conversion rate. If no currency is provided, the transaction will default to the cardholder's billing currency.
          example: GBP
        merchant:
          $ref: '#/components/schemas/IssuingMerchant'
        authorization_type:
          $ref: '#/components/schemas/IssuingAuthorizationTypes'
    ExpiryMonth:
      maximum: 12
      minimum: 1
      type: integer
      description: The card's expiration month.
      format: int32
      example: 5
    IssuingAuthorizationTypes:
      enum:
      - authorization
      - pre_authorization
      type: string
      description: Use `authorization` for a known final amount or `pre_authorization` for an estimated amount.
      default: authorization
      example: authorization
    PresentmentRequest:
      type: object
      properties:
        amount:
          minimum: 0
          type: integer
          description: 'The amount to clear. If not specified, the full authorized amount will be cleared.


            You must provide the amount in the transaction currency''s <a href="https://www.checkout.com/docs/resources/calculating-the-amount" target="blank">minor currency units</a>.

            '
          example: 2500
    IssuingTransactionId:
      maxLength: 30
      minLength: 30
      pattern: ^trx_[a-z0-9]{26}$
      type: string
      description: The transaction's unique identifier.
      example: trx_aayhhfwbdyxwcaeyhhfwbd4xga
    IssuingSimulateTransaction:
      required:
      - type
      type: object
      oneOf:
      - $ref: '#/components/schemas/Purchase'
      description: 'The transaction to simulate with the specified card. For example, a purchase.

        '
      discriminator:
        propertyName: type
        mapping:
          purchase: '#/components/schemas/Purchase'
    SimulateAuthorizationResponse:
      required:
      - status
      type: object
      properties:
        id:
          type: string
          description: "The transaction's unique identifier. \n\nThis same ID is carried throughout all authorization, reversal, and clearing messages related to the given transaction.\n"
          example: trx_aaqc4uaaybigcaaqc4uaayfiga
        status:
          enum:
          - Authorized
          - Declined
          type: string
          description: The transaction's status.
          example: Authorized
      description: Authorization Response.
    SimulateRefundRequest:
      type: object
      properties:
        amount:
          minimum: 0
          type: integer
          description: 'The amount to refund. If not specified, the full cleared amount will be refunded.


            You must provide the amount in the transaction currency''s <a href="https://www.checkout.com/docs/resources/calculating-the-amount" target="blank">minor currency units</a> .

            '
          example: 2500
    IssuingValidationError:
      type: object
      properties:
        request_id:
          type: string
          example: 0HLHPN8802NUF:00000003
        error_type:
          type: string
          example: request_invalid
        error_codes:
          maxItems: 20
          type: array
          items:
            type: string
            example: request_body_malformed
      additionalProperties: false
  securitySchemes:
    ApiPublicKey:
      type: apiKey
      description: "Public keys are for client-side authentication and supported only in JavaScript or native applications.\n  \n#### Format\n\n- Sandbox – `pk_sbox_xxxxxxxxxxxxxxxxxxxxxxxxxx`\n\n- Production – `pk_xxxxxxxxxxxxxxxxxxxxxxxxxx`\n\nWhen specifying your public key, use the format `Bearer {{PublicApiKey}}`.\n"
      name: Authorization
      in: header
      x-cko-type: publicKey
    ApiSecretKey:
      type: apiKey
      description: 'You can pass your secret API key in the `Authorization` header of your requests for supported endpoints.


        #### Format


        - Sandbox – `sk_sbox_xxxxxxxxxxxxxxxxxxxxxxxxxx`


        - Production – `sk_xxxxxxxxxxxxxxxxxxxxxxxxxx`


        When specifying your secret key, use the format `Bearer {{SecretApiKey}}`.


        ```

        curl --location --request POST ''https://{prefix}.api.checkout.com/{{path}}'' \

        --header ''Content-Type: application/json'' \

        --header ''Accept: application/json'' \

        --header ''Authorization: Bearer {{SecretApiKey}}'' \

        --data-raw ''{

        "amount": 10000,

        "currency": "USD",

        "reference": "Visa-USD-Test",

        ...

        }''

        ```

        '
      name: Authorization
      in: header
      x-cko-type: secretKey
    OAuth:
      type: oauth2
      description: "Your OAuth credentials include an access key ID and an access key secret. They correspond to an OAuth 2.0 client ID and a client secret respectively. \n\nTo exchange these credentials for an access token, call the [Request an access token](/tag/access/POST/connect/token) endpoint. Authenticate using basic authentication, with your access key ID as the username and your access key secret as the password.\n\n| Environment   |      Authorization server                            |\n|---------------|------------------------------------------------------|\n| Sandbox       |  https://{prefix}.access.sandbox.checkout.com/connect/token   |\n| Production    |  https://{prefix}.access.checkout.com/connect/token           |\n\n```\ncurl --location 'https://{prefix}.access.checkout.com/connect/token' \\\n--header 'Content-Type: application/x-www-form-urlencoded' \\\n--data-urlencode 'grant_type=client_credentials' \\\n--data-urlencode 'client_id=ack_...' \\\n--data-urlencode 'client_secret=...' \n```\n\nThe token server returns a Bearer `access_token` in JSON Web Token (JWT) format. Use this token in the `Authorization` header of your API requests.\n\n```\ncurl --location --request POST 'https://{prefix}.api.checkout.com/{{path}}' \\\n--header 'Content-Type: application/json' \\\n--header 'Accept: application/json' \\\n--header 'Authorization: Bearer {{AccessToken}}' \\\n--data-raw '{\n  \"amount\": 10000,\n  \"currency\": \"USD\",\n  \"reference\": \"Visa-USD-Test\",\n  ...\n}'\n```\n\nThe `expires_in` field in the response indicates the validity period of your access token in seconds. When your token expires, you must request a new one.\n\nDepending on the Environment against which you're making your requests against you'll need to request the token from a different Authorization Server.\n\n| Environment   |      Authorization Server                            |\n|---------------|------------------------------------------------------|\n| Sandbox       |  https://{prefix}.access.sandbox.checkout.com/connect/token   |\n| Production    |  https://{prefix}.access.checkout.com/connect/token           |\n\nYour base URL `{prefix}` is unique. To learn how to retrieve your unique base URLs for the sandbox and production environments, see [API endpoints](https://www.checkout.com/docs/developer-resources/api/api-endpoints).\n"
      flows:
        clientCredentials:
          tokenUrl: string
          scopes:
            vault: Access to all Vault resources
            vault:apme-enrollment: Manage Apple Pay Domain Enrollment
            vault:customers: Manage customers
            vault:card-metadata: Read card metadata
            vault:instruments: Create instruments
            vault:network-tokens: Manage network tokens
            vault:tokenization: Tokenize payment instruments
            vault:real-time-account-updater: Access to real-time account updater
            gateway: Access to all Gateway resources
            gateway:payment: Request payments
            gateway:payment-details: Get payment details
            gateway:payment-authorizations: Increment authorizations
            gateway:payment-voids: Void payments
            gateway:payment-captures: Capture payments
            gateway:payment-contexts: Manage payment contexts
            gateway:payment-cancellations: Manage payment cancellations
            gateway:payment-refunds: Refund payments
            fx: Foreign exchange services
            payouts:bank-details: Get bank details
            sessions:app: App-based authentication
            sessions:browser: Browser-based authentication
            disputes: Access to all Disputes resources
            disputes:view: View disputes
            disputes:provide-evidence: Provide dispute evidence
            disputes:accept: Accept disputes
            disputes:scheme-files: Read dispute scheme files
            accounts: Manage sub-entities
            flow: Access to all Flow resources
            flow:workflows: Manage workflows
            flow:events: Retrieve events
            flow:reflow: Manage workflows
            files: Access to all Files resources
            files:retrieve: Retrieve files
            files:upload: Upload files
            files:download: Download files
            forward: Access to Forward api
            forward:secrets: Manage secrets in Forward api
            balances: Access to all Balances resources
            balances:view: View balances
            balances:top-up-instructions: Get top-up instructions
            transfers: Access to all Transfers resources
            transfers:view: View transfers
            transfers:create: Create transfers
            middleware: Access to all Middleware resources
            middleware:merchants-secret: Allows merchant identity and Middleware token exchange from a secure execution environment
            middleware:merchants-public: Allows merchant identity and Middleware token exchange from an insecure execution environment
            payment-sessions: Access to all Payment Sessions resources
            payments:search: Search payments
            reports: Access to all Reports resources
            reports:view: View reports
            financial-actions: Access to all Financial actions resources
            financial-actions:view: View financial actions
            card-management: Access to all Card management resources
            issuing:card-management-read: Gives access to card management endpoints with GET operations
            issuing:card-management-write: Gives access to card management endpoints with POST/ PUT / DELETE operations
            issuing:controls-read: Gives access to card control endpoints with GET operations
            issuing:controls-write: Gives access to card control endpoints with POST/ PUT / DELETE operations
            transactions: Access to all transactions resources
            issuing:transactions-read: Gives access to get and search transactions
            issuing:transactions-write: Gives access to simulate transactions for testing purposes
            issuing-disputes: Access to Issuing disputes resources
            issuing:disputes-read: Gives access to get disputes
            issuing:disputes-write: Gives access to create and submit Issuing disputes
            identity-verification: Access to all Identities endpoints
            Payment Context: Read payment context
            agentic:inventory: Manage agentic commerce inventory and reservations
    SessionSecret:
      type: apiKey
      description: 'A base64 encoded value prefixed with `sek_` that gives access to client-side operations for a single authentication within the Sessions API. This value is returned as the `session_secret` when requesting a session.

        '
      name: Authorization
      in: header
