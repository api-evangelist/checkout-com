    IssuingStatus:
      enum:
      - active
      - inactive
      - revoked
      - suspended
      type: string
      description: 'The card''s status, which determines whether it can approve incoming authorizations:


        - `inactive`: the default state - authorizations will be declined until the card is activated

        - `active`: authorization requests can be approved

        - `suspended`: incoming authorization requests will be declined - the card can be reactivated to accept new authorizations

        - `revoked`: incoming authorization requests will be permanently declined - the card cannot be reactivated from this state

        '
      example: active
  securitySchemes:
    ApiPublicKey:
      type: apiKey
      description: "Public keys are for client-side authentication and supported only in JavaScript or native applications.\n  \n#### Format\n\n- Sandbox – `pk_sbox_xxxxxxxxxxxxxxxxxxxxxxxxxx`\n\n- Production – `pk_xxxxxxxxxxxxxxxxxxxxxxxxxx`\n\nWhen specifying your public key, use the format `Bearer {{PublicApiKey}}`.\n"
      name: Authorization
