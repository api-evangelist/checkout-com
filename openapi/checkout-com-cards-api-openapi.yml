openapi: 3.2.0
info:
  title: Checkout.com API Reference Cards API
  description: '## Get started

    Checkout.com provides a collection of APIs that enable you to integrate with our various products and services.

    Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using any HTTP or REST library.

    Sign up for a test account to gain access to the sandbox environment, where you can test API calls without affecting live data.

    For more information, see:


    - API endpoints

    - API rate limits

    - API changes

    - Idempotency

    - Private connections


    ## Base URLs

    The base URLs you must use for your API calls to the sandbox and production environments are unique to you.


    - `https://{prefix}.api.sandbox.checkout.com/{path}`

    - `https://{prefix}.api.checkout.com/{path}`

    - `https://{prefix}.access.sandbox.checkout.com/{path}`

    - `https://{prefix}.access.checkout.com/{path}`


    The unique API endpoint host names resolve to Checkout.com''s IP addresses. Do not allowlist these IP addresses.

    The `{prefix}` value in each base URL is a string containing the first eight characters of each of your environments'' unique `client_id`, excluding the `cli_` prefix.

    To find your unique base URL:

    1. Sign in to the Dashboard environment you want to retrieve the base URL for:


    - Sandbox

    - Production


    2. Go to _Developers_ > _Overview_.

    Your unique base URL is displayed on the _Developer overview_ page. For example, `https://vkuhvk4v.api.checkout.com`.


    3. Alternatively, go to _Settings_ > _Account details_.

    Your unique base URL is displayed under _Connection settings_.


    If you are unsure of your client ID or base URL for either environment, contact your account manager or request support.

    For more information, see API endpoints.

    ## Authentication

    When you sign up for an account, you can authenticate with either Access keys (OAuth 2.0), or Secret API keys.

    Unless explicitly stated, all endpoints require authentication using either your Access or Secret API Keys. Public keys should only be used in JavaScript or native applications.


    - **Client-side authentication**. Use your public key for client-side authentication. It only has access to a limited set of our APIs – mostly those called as part of your payment environment.


    - **Server-to-server authentication**. Use your secret key or OAuth for server-to-server communication. Support for API keys depends on the endpoint.


    Never share your OAuth credentials, API keys, or access tokens. Keep them guarded and secure.'
  termsOfService: https://www.checkout.com/legal/terms-and-policies
  contact:
    name: Checkout.com Support
    url: https://dashboard.checkout.com/support
  version: v1.0.0
servers:
- url: https://{prefix}.api.sandbox.checkout.com
  description: Sandbox environment
  variables:
    prefix:
      default: '{prefix}'
      description: Your unique <a href="https://www.checkout.com/docs/developer-resources/api/api-endpoints" target="_blank">base URL</a>. There is no default value.
- url: https://{prefix}.api.checkout.com
  description: Production environment
  variables:
    prefix:
      default: '{prefix}'
      description: Your unique <a href="https://www.checkout.com/docs/developer-resources/api/api-endpoints" target="_blank">base URL</a>. There is no default value.
tags:
- name: Cards
  description: Issue new cards to your cardholders, and manage cards you've already issued.
paths:
  /issuing/cards:
    post:
      tags:
      - Cards
      summary: Create a card
      description: Creates a physical or virtual card and issues it to the specified cardholder.
      operationId: createCard
      parameters:
      - $ref: '#/components/parameters/IssuingCkoIdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/add-card-request'
        required: true
      responses:
        '201':
          description: Card created successfully
          headers:
            cko-request-id:
              schema:
                $ref: '#/components/schemas/cko-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/add-card-response'
              examples:
                virtual:
                  value:
                    id: crd_fa6psq242dcd6fdn5gifcq1491
                    client_id: cli_vkuhvk4vjn2edkps7dfsq6emqm
                    entity_id: ent_fa6psq242dcd6fdn5gifcq1491
                    last_four: 1234
                    expiry_month: 5
                    expiry_year: 2025
                    billing_currency: USD
                    issuing_country: US
                    status: active
                    type: virtual
                    scheme: mastercard
                    created_date: '2019-09-10T10:11:12.0000000+00:00'
                physical:
                  value:
                    id: crd_fa6psq242dcd6fdn5gifcq1491
                    client_id: cli_vkuhvk4vjn2edkps7dfsq6emqm
                    entity_id: ent_fa6psq242dcd6fdn5gifcq1491
                    last_four: 1234
                    expiry_month: 5
                    expiry_year: 2025
                    billing_currency: USD
                    issuing_country: US
                    status: active
                    type: physical
                    scheme: mastercard
                    created_date: '2019-09-10T10:11:12.0000000+00:00'
        '401':
          description: Unauthorized
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
      security:
      - OAuth:
        - issuing:card-management-write
  /issuing/cards/{cardId}:
    get:
      tags:
      - Cards
      summary: Get card details
      description: 'Retrieves the details for a card you issued previously.


        The card''s credentials are not returned in the response.'
      operationId: getCard
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingCardId'
      responses:
        '200':
          description: Card retrieved successfully
          headers:
            cko-request-id:
              schema:
                $ref: '#/components/schemas/cko-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-card-response'
              examples:
                virtual:
                  value:
                    id: crd_fa6psq242dcd6fdn5gifcq1491
                    client_id: cli_vkuhvk4vjn2edkps7dfsq6emqm
                    entity_id: ent_fa6psq242dcd6fdn5gifcq1491
                    cardholder_id: crh_d3ozhf43pcq2xbldn2g45qnb44
                    card_product_id: pro_7syjig3jq3mezlc3vjrdpfitl4
                    last_four: 1234
                    expiry_month: 5
                    expiry_year: 2025
                    status: active
                    type: virtual
                    billing_currency: USD
                    issuing_country: US
                    scheme: mastercard
                physical:
                  value:
                    id: crd_fa6psq242dcd6fdn5gifcq1491
                    client_id: cli_vkuhvk4vjn2edkps7dfsq6emqm
                    entity_id: ent_fa6psq242dcd6fdn5gifcq1491
                    cardholder_id: crh_d3ozhf43pcq2xbldn2g45qnb44
                    card_product_id: pro_7syjig3jq3mezlc3vjrdpfitl4
                    last_four: 1234
                    expiry_month: 5
                    expiry_year: 2025
                    status: active
                    type: physical
                    billing_currency: USD
                    issuing_country: US
                    scheme: mastercard
        '401':
          description: Unauthorized
        '404':
          description: Card not found
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:card-management-read
    patch:
      tags:
      - Cards
      summary: Update card details
      description: 'Update the details of an issued card.


        Only the fields for which you provide values will be updated. If you pass `null`, the existing value will be removed.'
      operationId: updateCard
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingCardId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-card-request'
        required: true
      responses:
        '200':
          description: Card updated successfully
          headers:
            cko-request-id:
              schema:
                $ref: '#/components/schemas/cko-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-card-response'
        '401':
          description: Unauthorized
        '404':
          description: Card not found
        '422':
          description: Invalid data was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:card-management-write
  /issuing/cards/{cardId}/3ds-enrollment:
    post:
      tags:
      - Cards
      summary: Enroll a card in 3DS
      description: 'Enrolls a card in 3D Secure (3DS). Additional information is requested from the cardholder through a 3DS challenge when performing a transaction.


        Two-factor authentication (2FA) is supported. For maximum security, we recommend using a combination of a one-time password (OTP) sent via SMS, along with a password or question and answer security pair.'
      operationId: enrollCard
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingCardId'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/security_question'
              - $ref: '#/components/schemas/Password'
        required: true
      responses:
        '202':
          description: 3DS card enrollment completed successfully
          headers:
            cko-request-id:
              schema:
                $ref: '#/components/schemas/cko-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/3ds-enrollment-post-response'
        '401':
          description: Unauthorized
        '404':
          description: Card not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:card-management-write
    patch:
      tags:
      - Cards
      summary: Update a card's 3DS details
      description: Updates a card's 3DS enrollment details. At least one of the fields is required.
      operationId: updateCardEnrollmentDetails
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingCardId'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - title: security_question
                type: object
                properties:
                  security_pair:
                    $ref: '#/components/schemas/3dsSecurityPair'
                  locale:
                    $ref: '#/components/schemas/3dsLocale'
                  phone_number:
                    $ref: '#/components/schemas/3dsPhoneNumber'
              - title: password
                type: object
                properties:
                  password:
                    $ref: '#/components/schemas/3dsPassword'
                  locale:
                    $ref: '#/components/schemas/3dsLocale'
                  phone_number:
                    $ref: '#/components/schemas/3dsPhoneNumber'
        required: true
      responses:
        '202':
          description: Card 3DS details updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/3ds-enrollment-patch-response'
        '401':
          description: Unauthorized
        '404':
          description: Card not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:card-management-write
    get:
      tags:
      - Cards
      summary: Get a card's 3DS enrollment details
      description: Retrieves a card's 3DS enrollment details.
      operationId: getCardEnrollmentDetails
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingCardId'
      responses:
        '200':
          description: Card 3DS enrollment details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/3ds-enrollment-get-response'
        '401':
          description: Unauthorized
        '404':
          description: Card not found
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:card-management-read
  /issuing/cards/{cardId}/activate:
    post:
      tags:
      - Cards
      summary: Activate a card
      description: 'Activates an `inactive` or `suspended` card so that incoming authorizations can be approved.


        Activating a renewed card will schedule the parent card for revocation the following day, and transfer all configurations to the newly activated card. This includes 3DS enrollment, card controls, control profiles and tokenisation.'
      operationId: activateCard
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingCardId'
      responses:
        '200':
          description: Card activated successfully
          headers:
            cko-request-id:
              schema:
                $ref: '#/components/schemas/cko-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activate-card-response'
        '401':
          description: Unauthorized
        '404':
          description: Card not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
      security:
      - OAuth:
        - issuing:card-management-write
  /issuing/cards/{cardId}/credentials:
    get:
      tags:
      - Cards
      summary: Get the card credentials
      description: Retrieves the credentials for a card you issued previously.
      operationId: getCardCredentials
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingCardId'
      - name: credentials
        in: query
        schema:
          enum:
          - number
          - cvc2
          - number,cvc2
          type: string
          description: 'The credentials to retrieve.


            You can either specify `number` or `cvc2` to retrieve the specified credential, or both as a comma-separated list. For example, to retrieve both the CVC and PAN:


            ```

            "credentials": "number, cvc2"

            ```

            '
          example: number
      responses:
        '200':
          description: Card credentials retrieved successfully
          headers:
            cko-request-id:
              schema:
                $ref: '#/components/schemas/cko-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credentials'
        '401':
          description: Unauthorized
        '404':
          description: Card not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
      security:
      - OAuth:
        - issuing:card-management-read
  /issuing/cards/{cardId}/renew:
    post:
      tags:
      - Cards
      summary: Renew a card
      description: 'Renew an `active`, `inactive`, or `suspended` card. A card cannot be renewed if it is `revoked`, `expired`, or is a single use virtual card.


        The renewed card will have a different, nonconsecutive number (PAN), expiry date, and CVV.


        Any configuration set on the parent card will be copied to the renewed card when the renewed card is activated. This includes 3DS enrollment, card controls, control profiles, and tokenisation.'
      operationId: renewCard
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingCardId'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/physical_card'
              - $ref: '#/components/schemas/virtual_card'
        required: true
      responses:
        '200':
          description: Card renewed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/renew-card-response'
        '401':
          description: Unauthorized
        '404':
          description: Card not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '415':
          description: Unsupported Media Type
        '429':
          description: Too Many Requests
        '406':
          description: Not Acceptable
      security:
      - OAuth:
        - issuing:card-management-write
  /issuing/cards/{cardId}/revoke:
    post:
      tags:
      - Cards
      summary: Revoke a card
      description: 'Revokes an `inactive`, `active`, or `suspended` card to permanently decline all incoming authorizations.


        This is a permanent action. Revoked cards cannot be reactivated.'
      operationId: revokeCard
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingCardId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/revoke-card-request'
      responses:
        '200':
          description: Card revoked successfully
          headers:
            cko-request-id:
              schema:
                $ref: '#/components/schemas/cko-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/revoke-card-response'
        '401':
          description: Unauthorized
        '404':
          description: Card not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
      security:
      - OAuth:
        - issuing:card-management-write
  /issuing/cards/{cardId}/suspend:
    post:
      tags:
      - Cards
      summary: Suspend a card
      description: 'Suspends an `active` or `inactive` card to temporarily decline all incoming authorizations.


        A `suspended` card can be reactivated.'
      operationId: suspendCard
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingCardId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/suspend-card-request'
      responses:
        '200':
          description: Card suspended successfully
          headers:
            cko-request-id:
              schema:
                $ref: '#/components/schemas/cko-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/suspend-card-response'
        '401':
          description: Unauthorized
        '404':
          description: Card not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
      security:
      - OAuth:
        - issuing:card-management-write
components:
  schemas:
    suspend-card-response:
      type: object
      properties:
        _links:
          allOf:
          - $ref: '#/components/schemas/SuspendedCardLinks'
    IssuingAddress:
      required:
      - address_line1
      - city
      - zip
      - country
      type: object
      properties:
        address_line1:
          maxLength: 45
          minLength: 1
          pattern: ^[a-zA-Z0-9/àáâäãåąčćęèéêëėįìíîïłńòóôöõøùúûüųūÿýżźñçčšžÀÁÂÄÃÅĄĆČĖĘÈÉÊËÌÍÎÏĮŁŃÒÓÔÖÕØÙÚÛÜŲŪŸÝŻŹÑßÇŒÆČŠŽ∂ð \-,.'_#:]{1,45}$
          type: string
          description: The first line of the address.
          example: Checkout.com
        address_line2:
          maxLength: 45
          minLength: 1
          pattern: ^[a-zA-Z0-9/àáâäãåąčćęèéêëėįìíîïłńòóôöõøùúûüųūÿýżźñçčšžÀÁÂÄÃÅĄĆČĖĘÈÉÊËÌÍÎÏĮŁŃÒÓÔÖÕØÙÚÛÜŲŪŸÝŻŹÑßÇŒÆČŠŽ∂ð \-,.'_#:]{1,45}$
          type: string
          description: The second line of the address.
          example: 90 Tottenham Court Road
        city:
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-ZàáâäãåąčćęèéêëėįìíîïłńòóôöõøùúûüųūÿýżźñçčšžÀÁÂÄÃÅĄĆČĖĘÈÉÊËÌÍÎÏĮŁŃÒÓÔÖÕØÙÚÛÜŲŪŸÝŻŹÑßÇŒÆČŠŽ∂ð ,.'\-]{1,128}$
          type: string
          description: The address city.
          example: London
        state:
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-ZàáâäãåąčćęèéêëėįìíîïłńòóôöõøùúûüųūÿýżźñçčšžÀÁÂÄÃÅĄĆČĖĘÈÉÊËÌÍÎÏĮŁŃÒÓÔÖÕØÙÚÛÜŲŪŸÝŻŹÑßÇŒÆČŠŽ∂ð ,.'\-]{1,128}$
          type: string
          description: The address state.
          example: London
        zip:
          maxLength: 10
          minLength: 1
          pattern: ^[0-9a-zA-Z ]{1,10}$
          type: string
          description: The address zip code, or postal code.
          example: W1T 4TJ
        country:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
          type: string
          description: The address country, as an <a href="https://www.checkout.com/docs/resources/codes/country-codes" target="blank">ISO country code</a>.
          example: GB
    add-card-request:
      required:
      - type
      - cardholder_id
      - card_product_id
      type: object
      properties:
        type:
          type: string
          description: The card type.
          example: virtual
        cardholder_id:
          $ref: '#/components/schemas/IssuingCardholderId'
        lifetime:
          $ref: '#/components/schemas/CardLifetime'
        reference:
          $ref: '#/components/schemas/IssuingReference'
        metadata:
          allOf:
          - $ref: '#/components/schemas/IssuingCardMetadata'
          description: User's metadata
        scheduled_revocation_date:
          $ref: '#/components/schemas/IssuingScheduledRevocationDate'
        revocation_date:
          allOf:
          - $ref: '#/components/schemas/IssuingRevocationDate'
          description: 'Deprecated. Use `scheduled_revocation_date` instead.


            If you provide both fields, the `scheduled_revocation_date` value overrides this value.

            '
          deprecated: true
        scheduled_activation_date:
          $ref: '#/components/schemas/IssuingScheduledActivationDate'
        card_product_id:
          allOf:
          - $ref: '#/components/schemas/IssuingCardProductId'
          description: The card product's unique identifier. This field is required if there are multiple card products associated with the entity.
      discriminator:
        propertyName: type
        mapping:
          virtual: '#/components/schemas/add-virtual-card-request'
          physical: '#/components/schemas/add-physical-card-request'
    get-physical-card-response:
      title: physical
      required:
      - id
      - client_id
      - entity_id
      - cardholder_id
      - card_product_id
      - last_four
      - expiry_month
      - expiry_year
      - status
      - type
      - billing_currency
      - issuing_country
      - scheme
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IssuingCardId'
        client_id:
          $ref: '#/components/schemas/IssuingClientId'
        entity_id:
          $ref: '#/components/schemas/IssuingEntityId'
        cardholder_id:
          $ref: '#/components/schemas/IssuingCardholderId'
        card_product_id:
          $ref: '#/components/schemas/IssuingCardProductId'
        user_id:
          $ref: '#/components/schemas/IssuingUserId'
        last_four:
          $ref: '#/components/schemas/LastFour'
        expiry_month:
          $ref: '#/components/schemas/ExpiryMonth'
        expiry_year:
          $ref: '#/components/schemas/ExpiryYear'
        status:
          $ref: '#/components/schemas/IssuingStatus'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        type:
          allOf:
          - $ref: '#/components/schemas/IssuingType'
          - enum:
            - physical
          example: physical
        billing_currency:
          $ref: '#/components/schemas/IssuingCurrency'
        issuing_country:
          $ref: '#/components/schemas/IssuingCountry'
        reference:
          $ref: '#/components/schemas/IssuingReference'
        metadata:
          $ref: '#/components/schemas/IssuingCardMetadata'
        revocation_date:
          $ref: '#/components/schemas/IssuingRevocationDate'
        scheduled_activation_date:
          $ref: '#/components/schemas/IssuingScheduledActivationDate'
        root_card_id:
          $ref: '#/components/schemas/IssuingRootCardId'
        parent_card_id:
          $ref: '#/components/schemas/IssuingParentCardId'
        scheme:
          $ref: '#/components/schemas/Scheme'
        created_date:
          $ref: '#/components/schemas/Datetime'
        last_modified_date:
          $ref: '#/components/schemas/Datetime'
        _links:
          allOf:
