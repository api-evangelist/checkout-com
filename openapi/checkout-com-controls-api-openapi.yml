openapi: 3.2.0
info:
  title: Checkout.com API Reference Controls API
  description: '## Get started

    Checkout.com provides a collection of APIs that enable you to integrate with our various products and services.

    Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using any HTTP or REST library.

    Sign up for a test account to gain access to the sandbox environment, where you can test API calls without affecting live data.

    For more information, see:


    - API endpoints

    - API rate limits

    - API changes

    - Idempotency

    - Private connections


    ## Base URLs

    The base URLs you must use for your API calls to the sandbox and production environments are unique to you.


    - `https://{prefix}.api.sandbox.checkout.com/{path}`

    - `https://{prefix}.api.checkout.com/{path}`

    - `https://{prefix}.access.sandbox.checkout.com/{path}`

    - `https://{prefix}.access.checkout.com/{path}`


    The unique API endpoint host names resolve to Checkout.com''s IP addresses. Do not allowlist these IP addresses.

    The `{prefix}` value in each base URL is a string containing the first eight characters of each of your environments'' unique `client_id`, excluding the `cli_` prefix.

    To find your unique base URL:

    1. Sign in to the Dashboard environment you want to retrieve the base URL for:


    - Sandbox

    - Production


    2. Go to _Developers_ > _Overview_.

    Your unique base URL is displayed on the _Developer overview_ page. For example, `https://vkuhvk4v.api.checkout.com`.


    3. Alternatively, go to _Settings_ > _Account details_.

    Your unique base URL is displayed under _Connection settings_.


    If you are unsure of your client ID or base URL for either environment, contact your account manager or request support.

    For more information, see API endpoints.

    ## Authentication

    When you sign up for an account, you can authenticate with either Access keys (OAuth 2.0), or Secret API keys.

    Unless explicitly stated, all endpoints require authentication using either your Access or Secret API Keys. Public keys should only be used in JavaScript or native applications.


    - **Client-side authentication**. Use your public key for client-side authentication. It only has access to a limited set of our APIs – mostly those called as part of your payment environment.


    - **Server-to-server authentication**. Use your secret key or OAuth for server-to-server communication. Support for API keys depends on the endpoint.


    Never share your OAuth credentials, API keys, or access tokens. Keep them guarded and secure.'
  termsOfService: https://www.checkout.com/legal/terms-and-policies
  contact:
    name: Checkout.com Support
    url: https://dashboard.checkout.com/support
  version: v1.0.0
servers:
- url: https://{prefix}.api.sandbox.checkout.com
  description: Sandbox environment
  variables:
    prefix:
      default: '{prefix}'
      description: Your unique <a href="https://www.checkout.com/docs/developer-resources/api/api-endpoints" target="_blank">base URL</a>. There is no default value.
- url: https://{prefix}.api.checkout.com
  description: Production environment
  variables:
    prefix:
      default: '{prefix}'
      description: Your unique <a href="https://www.checkout.com/docs/developer-resources/api/api-endpoints" target="_blank">base URL</a>. There is no default value.
tags:
- name: Controls
  description: Set spending controls to limit how much can be spent over a given period of time.
paths:
  /issuing/controls:
    post:
      tags:
      - Controls
      summary: Create a control
      description: Creates a control and applies it to the specified target.
      operationId: createControl
      parameters:
      - $ref: '#/components/parameters/IssuingCkoIdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/add-control-request'
        required: true
      responses:
        '201':
          description: Control created successfully
          headers:
            cko-request-id:
              schema:
                $ref: '#/components/schemas/cko-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/add-control-response'
              examples:
                velocity_limit:
                  value:
                    id: ctr_gp7vkmxayztufjz6top5bjcdra
                    description: Maximum spend of 500€ per week for restaurants
                    control_type: velocity_limit
                    target_id: crd_fa6psq42dcdd6fdn5gifcq1491
                    is_editable: true
                    created_date: '2023-03-12T18:20:12.0000000+00:00'
                    last_modified_date: '2023-03-12T18:20:12.0000000+00:00'
                    velocity_limit:
                      amount_limit: 50000
                      velocity_window:
                        type: weekly
                      mcc_list:
                      - 4121
                      - 4582
                    _links:
                      self:
                        href: https://{prefix}.api.checkout.com/issuing/controls/ctr_gp7vkmxayztufjz6top5bjcdra
                        actions:
                        - GET
                        types:
                        - application/json
                mcc_limit:
                  value:
                    id: ctr_gp7vkmxayztufjz6top5bjcdra
                    description: Allow the card to be used only in restaurants and supermarkets
                    control_type: mcc_limit
                    target_id: crd_fa6psq42dcdd6fdn5gifcq1491
                    is_editable: true
                    created_date: '2023-03-12T18:20:12.0000000+00:00'
                    last_modified_date: '2023-03-12T18:20:12.0000000+00:00'
                    mcc_limit:
                      type: allow
                      mcc_list:
                      - 5932
                      - 5411
                    _links:
                      self:
                        href: https://{prefix}.api.checkout.com/issuing/controls/ctr_gp7vkmxayztufjz6top5bjcdra
                        actions:
                        - GET
                        types:
                        - application/json
                mid_limit:
                  value:
                    id: ctr_gp7vkmxayztufjz6top5bjcdra
                    description: Allow the card to be used only in AZ Pizza
                    control_type: mid_limit
                    target_id: crd_fa6psq42dcdd6fdn5gifcq1491
                    is_editable: true
                    created_date: '2023-03-12T18:20:12.0000000+00:00'
                    last_modified_date: '2023-03-12T18:20:12.0000000+00:00'
                    mid_limit:
                      type: allow
                      mid_list:
                      - 593278
                      - 541114
                    _links:
                      self:
                        href: https://{prefix}.api.checkout.com/issuing/controls/ctr_gp7vkmxayztufjz6top5bjcdra
                        actions:
                        - GET
                        types:
                        - application/json
        '401':
          description: Unauthorized
        '404':
          description: Target not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
      security:
      - OAuth:
        - issuing:controls-write
    get:
      tags:
      - Controls
      summary: Get controls by target
      description: Retrieves a list of spending controls applied to the specified target.
      operationId: getControlByTarget
      parameters:
      - name: target_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/IssuingTargetId'
      responses:
        '200':
          description: Target's controls retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-controls-array-response'
        '401':
          description: Unauthorized
        '404':
          description: Target not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:controls-read
  /issuing/controls/{controlId}:
    get:
      tags:
      - Controls
      summary: Get control details
      description: Retrieves the details of an existing control.
      operationId: getControl
      parameters:
      - name: controlId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingControlId'
      - name: cardId
        in: query
        description: The unique identifier for the card you want to get the remaining cascading velocity control for.
        schema:
          $ref: '#/components/schemas/IssuingCardId'
      responses:
        '200':
          description: Control retrieved successfully
          headers:
            cko-request-id:
              schema:
                $ref: '#/components/schemas/cko-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-control-response'
              examples:
                velocity_limit:
                  value:
                    id: ctr_gp7vkmxayztufjz6top5bjcdra
                    target_id: crd_fa6psq42dcdd6fdn5gifcq1491
                    description: Maximum spend of 500€ per week for restaurants
                    control_type: velocity_limit
                    is_editable: true
                    created_date: '2023-03-12T18:20:12.0000000+00:00'
                    last_modified_date: '2023-03-12T18:20:12.0000000+00:00'
                    velocity_limit:
                      amount_remaining: 45000
                      amount_limit: 50000
                      velocity_window:
                        type: weekly
                      mcc_list:
                      - 4121
                      - 4582
                mcc_limit:
                  value:
                    id: ctr_gp7vkmxayztufjz6top5bjcdra
                    target_id: crd_fa6psq42dcdd6fdn5gifcq1491
                    description: Allow the card to be used only in restaurants and supermarkets
                    control_type: mcc_limit
                    is_editable: true
                    created_date: '2023-03-12T18:20:12.0000000+00:00'
                    last_modified_date: '2023-03-12T18:20:12.0000000+00:00'
                    mcc_limit:
                      type: allow
                      mcc_list:
                      - 5932
                      - 5411
                mid_limit:
                  value:
                    id: ctr_gp7vkmxayztufjz6top5bjcdra
                    target_id: crd_fa6psq42dcdd6fdn5gifcq1491
                    description: Allow the card to be used only in AZ Pizza
                    control_type: mid_limit
                    is_editable: true
                    created_date: '2023-03-12T18:20:12.0000000+00:00'
                    last_modified_date: '2023-03-12T18:20:12.0000000+00:00'
                    mid_limit:
                      type: allow
                      mid_list:
                      - 593278
                      - 541114
        '401':
          description: Unauthorized
        '404':
          description: Control not found
        '500':
          description: Internal Server Error
      security:
      - OAuth:
        - issuing:controls-read
    put:
      tags:
      - Controls
      summary: Update a control
      description: Updates an existing control.
      operationId: updateControl
      parameters:
      - name: controlId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingControlId'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/update-control-request-mcc-limit'
              - $ref: '#/components/schemas/update-control-request-mid-limit'
              - $ref: '#/components/schemas/update-control-request-velocity-limit'
        required: true
      responses:
        '200':
          description: Control updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-control-response'
              examples:
                velocity_limit:
                  value:
                    id: ctr_gp7vkmxayztufjz6top5bjcdra
                    target_id: crd_fa6psq42dcdd6fdn5gifcq1491
                    description: Maximum spend of 500€ per week for restaurants
                    control_type: velocity_limit
                    is_editable: true
                    created_date: '2023-03-12T18:20:12.0000000+00:00'
                    last_modified_date: '2023-03-12T18:20:12.0000000+00:00'
                    velocity_limit:
                      amount_remaining: 45000
                      amount_limit: 50000
                      velocity_window:
                        type: weekly
                      mcc_list:
                      - 4121
                      - 4582
                mcc_limit:
                  value:
                    id: ctr_gp7vkmxayztufjz6top5bjcdra
                    target_id: crd_fa6psq42dcdd6fdn5gifcq1491
                    description: Allow the card to be used only in restaurants and supermarkets
                    control_type: mcc_limit
                    is_editable: true
                    created_date: '2023-03-12T18:20:12.0000000+00:00'
                    last_modified_date: '2023-03-12T18:20:12.0000000+00:00'
                    mcc_limit:
                      type: allow
                      mcc_list:
                      - 5932
                      - 5411
                mid_limit:
                  value:
                    id: ctr_gp7vkmxayztufjz6top5bjcdra
                    target_id: crd_fa6psq42dcdd6fdn5gifcq1491
                    description: Allow the card to be used only in AZ Pizza
                    control_type: mid_limit
                    is_editable: true
                    created_date: '2023-03-12T18:20:12.0000000+00:00'
                    last_modified_date: '2023-03-12T18:20:12.0000000+00:00'
                    mid_limit:
                      type: allow
                      mid_list:
                      - 593278
                      - 541114
        '401':
          description: Unauthorized
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '404':
          description: Control not found
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
      security:
      - OAuth:
        - issuing:controls-write
    delete:
      tags:
      - Controls
      summary: Remove a control
      description: 'Removes an existing control from the target it was applied to.


        If you want to reapply an equivalent control to the target, you must create a new control.'
      operationId: deleteControl
      parameters:
      - name: controlId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IssuingControlId'
      responses:
        '200':
          description: Control deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/remove-control-response'
        '401':
          description: Unauthorized
        '404':
          description: Control not found
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingValidationError'
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
      security:
      - OAuth:
        - issuing:controls-write
components:
  schemas:
    IssuingTargetIdForAdd:
      maxLength: 30
      minLength: 30
      pattern: ^(crd|cpr)_[a-z0-9]{26}$
      type: string
      description: The ID of the card or control profile to apply the control to. Note that control profiles cannot be a target for `velocity_limit` controls.
      example: crd_fa6psq42dcdd6fdn5gifcq1491
    update-control-response:
      required:
      - id
      - control_type
      - target_id
      - is_editable
      - created_date
      - last_modified_date
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IssuingControlId'
        description:
          maxLength: 256
          type: string
          description: The description of the control.
          example: Max spend of 500€ per week for restaurants
        control_type:
          $ref: '#/components/schemas/IssuingControlType'
        target_id:
          $ref: '#/components/schemas/IssuingTargetId'
        is_editable:
          $ref: '#/components/schemas/ControlIsEditable'
        created_date:
          $ref: '#/components/schemas/Datetime'
        last_modified_date:
          $ref: '#/components/schemas/Datetime'
      description: The control's details.
      discriminator:
        propertyName: control_type
        mapping:
          velocity_limit: '#/components/schemas/update-control-velocity-limit-response'
          mcc_limit: '#/components/schemas/update-control-mcc-limit-response'
          mid_limit: '#/components/schemas/update-control-mid-limit-response'
    add-control-response:
      required:
      - id
      - control_type
      - target_id
      - is_editable
      - created_date
      - last_modified_date
      - _links
      type: object
      oneOf:
      - $ref: '#/components/schemas/velocity-limit-response'
      - $ref: '#/components/schemas/mcc-limit-response'
      - $ref: '#/components/schemas/mid-limit-response'
      properties:
        id:
          $ref: '#/components/schemas/IssuingControlId'
        description:
          maxLength: 256
          type: string
          description: A description for the control.
        control_type:
          $ref: '#/components/schemas/IssuingControlType'
        target_id:
          $ref: '#/components/schemas/IssuingTargetId'
        is_editable:
          $ref: '#/components/schemas/ControlIsEditable'
        created_date:
          type: string
          format: date-time
          example: '2023-03-12T18:20:12.0000000+00:00'
        last_modified_date:
          type: string
          format: date-time
          example: '2023-03-12T18:20:12.0000000+00:00'
        _links:
          allOf:
          - $ref: '#/components/schemas/ControlLinks'
      description: The control's details.
      discriminator:
        propertyName: control_type
        mapping:
          velocity_limit: '#/components/schemas/velocity-limit-response'
          mcc_limit: '#/components/schemas/mcc-limit-response'
          mid_limit: '#/components/schemas/mid-limit-response'
    update-control-request-mcc-limit:
      type: object
      properties:
        description:
          maxLength: 256
          type: string
          description: A description for the control.
          example: Allow the card to be used only in restaurants and supermarkets
        mcc_limit:
          $ref: '#/components/schemas/MccLimit'
      description: 'The control you want to update.


        You can update only one control per request.

        '
    IssuingControlType:
      enum:
      - velocity_limit
      - mcc_limit
      - mid_limit
      type: string
      description: 'The control''s type.


        A `velocity_limit` determines how much can be spent over a given period of time. An `mcc_limit` determines the types of businesses from which transactions can be processed. A `mid_limit` specifies the merchants from whom transactions can be processed.

        '
      example: velocity_limit
    MidLimit:
      required:
      - mid_list
      - type
      type: object
      properties:
        type:
          enum:
          - allow
          - block
          type: string
          description: Sets whether to allow or block the list of MIDs supplied.
          example: allow
        mid_list:
          type: array
          items:
            $ref: '#/components/schemas/MidCode'
          description: The list of merchant identification (MID) codes to allow or block transactions from.
          example:
          - 593278
          - 541114
      description: The merchant identification (MID) code rule, which determines the merchants from whom transactions can be processed.
    get-control-response:
      required:
      - id
      - target_id
      - description
      - control_type
      - is_editable
      - created_date
      - last_modified_date
      type: object
      oneOf:
      - $ref: '#/components/schemas/get-control-velocity-limit-response'
      - $ref: '#/components/schemas/get-control-mcc-limit-response'
      - $ref: '#/components/schemas/get-control-mid-limit-response'
      properties:
        id:
          $ref: '#/components/schemas/IssuingControlId'
        target_id:
          $ref: '#/components/schemas/IssuingTargetId'
        description:
          maxLength: 256
          type: string
          description: A description for the control.
          example: Max spend of 500€ per week for restaurants
        control_type:
          $ref: '#/components/schemas/IssuingControlType'
        is_editable:
          $ref: '#/components/schemas/ControlIsEditable'
        created_date:
          $ref: '#/components/schemas/Datetime'
        last_modified_date:
          $ref: '#/components/schemas/Datetime'
      description: The control's details.
      discriminator:
        propertyName: control_type
        mapping:
          velocity_limit: '#/components/schemas/get-control-velocity-limit-response'
          mcc_limit: '#/components/schemas/get-control-mcc-limit-response'
          mid_limit: '#/components/schemas/get-control-mid-limit-response'
    IssuingCardId:
      maxLength: 30
      minLength: 30
      pattern: ^crd_[a-z0-9]{26}$
      type: string
      description: The card's unique identifier.
      example: crd_fa6psq242dcd6fdn5gifcq1491
    MccLimit:
      required:
      - mcc_list
      - type
      type: object
      properties:
        type:
          enum:
          - allow
          - block
          type: string
          description: Sets whether to allow or block the list of MCCs supplied.
          example: allow
        mcc_list:
          type: array
          items:
            type: string
          description: The list of <a href= "https://www.checkout.com/docs/resources/codes/merchant-category-codes">MCCs</a> to allow or block transactions from, as 4-digit ISO 18245 codes.
          example:
          - '5932'
          - '5411'
      description: The <a href= "https://www.checkout.com/docs/resources/codes/merchant-category-codes">merchant category code (MCC)</a> rule, which determines the types of businesses transactions can be processed from.
    get-control-velocity-limit-response:
      title: velocity_limit
      required:
      - id
      - target_id
      - description
      - control_type
      - is_editable
      - created_date
      - last_modified_date
      - velocity_limit
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IssuingControlId'
        target_id:
          $ref: '#/components/schemas/IssuingTargetId'
        description:
          maxLength: 256
          type: string
          description: A description for the control.
          example: Maximum spend of 500€ per week for restaurants
        control_type:
          allOf:
          - $ref: '#/components/schemas/IssuingControlType'
          example: velocity_limit
        is_editable:
          $ref: '#/components/schemas/ControlIsEditable'
        created_date:
          $ref: '#/components/schemas/Datetime'
        last_modified_date:
          $ref: '#/components/schemas/Datetime'
        velocity_limit:
          $ref: '#/components/schemas/VelocityLimitWithRemainingAmount'
    add-control-request:
      required:
      - control_type
      - target_id
      type: object
      oneOf:
      - $ref: '#/components/schemas/velocity-limit-request'
      - $ref: '#/components/schemas/mcc-limit-request'
      - $ref: '#/components/schemas/mid-limit-request'
      properties:
        description:
          maxLength: 256
          type: string
          description: A description for the control.
        control_type:
          $ref: '#/components/schemas/IssuingControlType'
        target_id:
          $ref: '#/components/schemas/IssuingTargetIdForAdd'
      description: The control to create.
      discriminator:
        propertyName: control_type
        mapping:
          velocity_limit: '#/components/schemas/velocity-limit-request'
          mcc_limit: '#/components/schemas/mcc-limit-request'
          mid_limit: '#/components/schemas/mid-limit-request'
    VelocityLimit:
      required:
      - velocity_window
      - amount_limit
      type: object
      properties:
        amount_limit:
          minimum: 0
          type: integer
          description: The amount the target can spend, in minor units.
          format: int64
          example: 50000
        velocity_window:
          $ref: '#/components/schemas/VelocityWindow'
        mcc_list:
          type: array
          items:
            type: string
          description: The list of <a href= "https://www.checkout.com/docs/resources/codes/merchant-category-codes">merchant category codes</a> (MCCs) that the velocity limit applies to, as four-digit ISO 18245 codes.
        mid_list:
          type: array
          items:
            $ref: '#/components/schemas/MidCode'
          description: The list of merchant identification (MID) codes to allow or block transactions from. <br/> You can provide either `mcc_list` or `mid_list`, but not both.
          example:
          - 1234567890
      description: The velocity limit, which determines how much a target card can spend over a given timeframe.
    VelocityLimitWithRemainingAmount:
      required:
      - velocity_window
      - amount_remaining
      - amount_limit
      type: object
      properties:
        amount_remaining:
          minimum: 0
          type: integer
          description: The remaining amount that can be spent, in minor units.
          format: int64
          example: 45000
        amount_limit:
          minimum: 0
          type: integer
          description: The amount that can be spent, in minor units.
          format: int64
          example: 50000
        velocity_window:
          $ref: '#/components/schemas/VelocityWindow'
        mcc_list:
          type: array
          items:
            type: string
          description: The list of <a href= "https://www.checkout.com/docs/resources/codes/merchant-category-codes">merchant category codes</a> (MCCs) that the velocity limit applies to, as four-digit ISO 18245 codes.
          example:
          - '4121'
          - '4582'
        mid_list:
          type: array
          items:
            type: string
          description: The list of merchant identification (MID) codes to allow or block transactions from. <br/> You can provide either `mcc_list` or `mid_list`, but not both.
          example:
          - '1234567890'
      description: The velocity limit, which determines how much a target card can spend over a given timeframe.
    velocity-limit-response:
      title: velocity_limit
      required:
      - id
      - control_type
      - target_id
      - is_editable
      - created_date
      - last_modified_date
      - _links
      - velocity_limit
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IssuingControlId'
        description:
          maxLength: 256
          type: string
          description: A description for the control.
          example: Maximum spend of 500€ per week for restaurants
        control_type:
          allOf:
          - $ref: '#/components/schemas/IssuingControlType'
