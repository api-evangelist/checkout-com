      summary: Submit dispute evidence
      description: With this final request, you can submit the evidence that you have previously provided. Make sure you have provided all the relevant information before using this request. You will not be able to amend your evidence once you have submitted it.
      operationId: submitDisputeEvidence
      parameters:
      - name: dispute_id
        in: path
        description: The dispute identifier.
        required: true
        schema:
          pattern: ^(dsp)_(\w{26})$
          type: string
      responses:
        '204':
          description: Dispute evidence submitted successfully
        '401':
          description: Unauthorized
        '404':
          description: Dispute not found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                properties:
                  request_id:
                    type: string
                    description: The request identifier.
                  error_type:
                    type: string
                    description: The error type.
                  error_codes:
                    type: array
                    items:
                      type: string
                    description: "The error codes returned from the validation. Each error code indicates the transaction with the problem.\n  * `two_core_properties_in_historical_transactions_required` - When using compelling evidence you need to provide at least two of the following properties: `ip_address`, `device_id`, `shipping_address` or `user_id`.\n  * `two_historical_transactions_required` - When using compelling evidence you need to provide at least two historical transactions.\n  * `ip_address_and_device_id_is_required` - When using compelling evidence you need to provide `ip_address` or `device_id`.\n  * `historical_transactions_should_be_different` - When using compelling evidence you need to provide different historical transactions.\n  * `historical_transaction_{transaction_index}_fraud_report` - The ARN provided has a fraud report related.\n  * `historical_transaction_{transaction_index}_active_dispute` - The ARN provided has an active dispute related.\n  * `historical_transaction_{transaction_index}_fraud_dispute` - The ARN provided has a fraud dispute related.\n  * `historical_transaction_{transaction_index}_not_found` - The ARN provided was not found.\n  * `historical_transaction_{transaction_index}_age_invalid` - The historical transaction must be between 120 and 365 days.\n  * `historical_transaction_{transaction_index}_bin_and_caid_not_exact_match` - The BIN and CAID from the transaction provided does not match with the disputed transaction.\n  * `historical_transaction_{transaction_index}_billing_descriptor_does_not_match` - The billing descriptor from the transaction provided does not match with the disputed transaction.\n  * `historical_transaction_{transaction_index}_card_does_not_match` - The card from the transaction provided does not match with the disputed transaction.\n"
