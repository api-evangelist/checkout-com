    FavFaceAuthenticationLinks:
      type: object
      allOf:
      - $ref: '#/components/schemas/IdvSelfLink'
      - $ref: '#/components/schemas/IdvApplicantLink'
      description: The details of links related to the resource.
    FavFaceAuthenticationError:
      required:
      - error_type
      - error_codes
      type: object
      properties:
        error_type:
          enum:
          - unprocessable_entity
          - request_invalid
          type: string
          description: The type of error.
        error_codes:
          type: array
          items:
            type: string
          description: The error codes.
    FavVerificationStatuses:
      enum:
      - approved
      - capture_in_progress
      - checks_in_progress
      - created
      - declined
      - inconclusive
      - pending
      - refused
      - retry_required
