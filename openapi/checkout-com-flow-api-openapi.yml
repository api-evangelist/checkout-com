          description: "The number of transactions associated with the cardholder's account with the 3DS Requestor in the previous year. This value includes both successful and abandoned transactions, across all payment accounts. \n\nSet this value to `999` if the number of transactions is `1000` or greater.\n"
          example: 2
        payment_account_age:
          type: string
          description: The UTC date and time the payment account was enrolled in the cardholder’s account with the 3DS Requestor, in ISO 8601 format.
          format: date-time
        shipping_address_usage:
