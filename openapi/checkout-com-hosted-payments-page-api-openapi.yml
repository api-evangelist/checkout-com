          self:
            href: https://{prefix}.api.sandbox.checkout.com/hosted-payments/hpp_xGQBg0AXl3cM
          redirect:
            href: https://pay.sandbox.checkout.com/page/hpp_xGQBg0AXl3cM
    GetHostedPaymentsResponseStatusExpired:
