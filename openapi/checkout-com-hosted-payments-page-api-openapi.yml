          allOf:
          - $ref: '#/components/schemas/PaymentInterfacesPaymentMethods'
          description: 'Specifies which payment method options to not present to the customer.


            If you specify the same payment method in this field and in `allow_payment_methods`, the `disabled_payment_methods` value will be overridden.


            Any payment method options not explicitly specified in this field will be presented to the customer by default.

            '
          example:
          - eps
          - ideal
          - knet
        products:
          allOf:
          - $ref: '#/components/schemas/PaymentInterfacesProducts'
        risk:
          required:
          - enabled
          type: object
          properties:
            enabled:
              type: boolean
              description: Specifies whether to perform a risk assessment.
              default: true
              example: false
          description: Configures the risk assessment performed during payment processing.
        customer_retry:
          type: object
          properties:
            max_attempts:
              maximum: 5
              minimum: 0
              type: integer
              description: The maximum number of customer retry attempts, excluding the initial payment attempt.
              default: 5
              example: 2
          description: 'Configures the parameters for customer retries.


            A customer retry is a payment attempt performed by the customer on the checkout page. This differs from [authorization request retries](https://api-reference.checkout.com/#operation/requestAPaymentOrPayout!path=0/retry&t=request) performed in the back end by Checkout.com.

            '
        sender:
          type: object
          allOf:
          - $ref: '#/components/schemas/PaymentInterfacesSender'
          description: The sender of the payment.
        success_url:
          maxLength: 255
          type: string
          description: For redirect payment methods, this overrides the default success redirect URL configured on your account
          format: uri
          example: https://example.com/payments/success
        cancel_url:
          maxLength: 255
          type: string
          description: The URL to which the customer should be directed if they cancel the payment
          format: uri
          example: https://example.com/payments/cancel
        failure_url:
          maxLength: 255
          type: string
          description: For redirect payment methods, this overrides the default failure redirect URL configured on your account
          format: uri
          example: https://example.com/payments/failure
        metadata:
          title: The Metadata Schema
          type: object
          description: Allows you to store additional information about the transaction. This object only allows one level of depth, so cannot accept non-primitive data types such as objects or arrays.
        locale:
          enum:
          - ar
          - da-DK
          - de-DE
          - el
          - en-GB
          - es-ES
          - fi-FI
          - fil-PH
          - fr-FR
          - hi-IN
          - id-ID
          - it-IT
          - ja-JP
          - ms-MY
          - nb-NO
          - nl-NL
          - pt-PT
          - sv-SE
          - th-TH
          - vi-VN
          - zh-CN
          - zh-HK
          - zh-TW
          type: string
          description: Creates a translated version of the page in the specified language
          default: en-GB
        3ds:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether to process this payment as a 3D Secure payment
              default: false
              example: false
            attempt_n3d:
              type: boolean
              description: Applies only when `3ds.enabled` is set to `true`. Set to `true` to attempt the payment without 3DS when the issuer, card, or network doesn’t support 3DS.
              default: false
              example: false
            challenge_indicator:
              enum:
              - no_preference
              - no_challenge_requested
              - challenge_requested
              - challenge_requested_mandate
              type: string
              description: Indicates the preference for whether or not a 3DS challenge should be performed. The customer’s bank has the final say on whether or not the customer receives the challenge.
              default: no_preference
            allow_upgrade:
              type: boolean
              description: Whether to process this payment as 3D Secure if the authorization was soft declined because 3DS authentication is required.
              default: true
            exemption:
              enum:
              - low_value
              - secure_corporate_payment
              - trusted_listing
              - transaction_risk_assessment
              - 3ds_outage
              - sca_delegation
              - out_of_sca_scope
              - other
              - low_risk_program
              - recurring_operation
              type: string
              description: Specifies an exemption reason so that the payment is not processed using 3D Secure authentication. Learn more about exemptions in our <a href="https://www.checkout.com/docs/payments/regulation-support/sca-compliance-guide#Possible_SCA_exemptions" target="_blank">SCA compliance guide</a>.
          description: Information required for 3D Secure payments
        capture:
          type: boolean
          description: Whether to capture the payment (if applicable).
          example: true
        capture_on:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          description: 'A timestamp (ISO 8601 code) that determines when the payment should be captured.

            Providing this field will automatically set `capture` to true.

            '
        instruction:
          type: object
          properties:
            purpose:
              allOf:
              - $ref: '#/components/schemas/Purpose'
          description: Details about the payment instruction.
        payment_method_configuration:
          type: object
          properties:
            applepay:
              type: object
              properties:
                account_holder:
                  required:
                  - type
                  type: object
                  description: The account holder's details.
                  discriminator:
                    propertyName: type
                    mapping:
                      individual: '#/components/schemas/01_PaymentSessionRequest_AccountHolderIndividual'
                      corporate: '#/components/schemas/02_PaymentSessionRequest_AccountHolderCorporate'
                      government: '#/components/schemas/03_PaymentSessionRequest_AccountHolderGovernment'
                store_payment_details:
                  $ref: '#/components/schemas/PaymentInterfacesStorePaymentDetails'
              description: Configuration options specific to Apple Pay payments.
            card:
              type: object
              properties:
                store_payment_details:
                  enum:
                  - disabled
                  - enabled
                  - collect_consent
                  type: string
                  description: "Specifies whether you intend to store the cardholder's payment details.\n\nIf you set this field to `enabled` or `collect_consent`, you must:\n\n- Have obtained consent from the cardholder to store their payment details\n- Provide `customer.id` or `customer.email` in the request\n\nYou do not need to provide this field if `payment_type` is set to one of the following values:\n\n - `Installment`\n - `Recurring`\n - `Unscheduled`\n"
                  default: disabled
                account_holder:
                  required:
                  - type
                  type: object
                  description: The account holder's details.
                  discriminator:
                    propertyName: type
                    mapping:
                      individual: '#/components/schemas/01_PaymentSessionRequest_AccountHolderIndividual'
                      corporate: '#/components/schemas/02_PaymentSessionRequest_AccountHolderCorporate'
                      government: '#/components/schemas/03_PaymentSessionRequest_AccountHolderGovernment'
              description: Configuration options specific to card payments.
            googlepay:
              type: object
              properties:
                account_holder:
                  required:
                  - type
                  type: object
                  description: The account holder's details.
                  discriminator:
                    propertyName: type
                    mapping:
                      individual: '#/components/schemas/01_PaymentSessionRequest_AccountHolderIndividual'
                      corporate: '#/components/schemas/02_PaymentSessionRequest_AccountHolderCorporate'
                      government: '#/components/schemas/03_PaymentSessionRequest_AccountHolderGovernment'
                store_payment_details:
                  $ref: '#/components/schemas/PaymentInterfacesStorePaymentDetails'
              description: Configuration options specific to Google Pay payments.
            stored_card:
              type: object
              properties:
                customer_id:
                  pattern: ^(cus)_(\w{26})$
                  type: string
                  description: 'The unique identifier for an existing [customer](https://api-reference.checkout.com/#tag/Customers). Enables the stored card payment method if the associated customer has one or more payment instruments stored.


                    This value takes precedence over `payment_method_configuration.stored_card.instrument_ids` when determining the stored cards to present to the customer.

                    '
                instrument_ids:
                  maxItems: 10
                  minItems: 1
                  type: array
                  items:
                    pattern: ^(src)_(\w{26})$
                    type: string
                  description: 'The unique identifiers for card Instruments. Enables stored card payment method if any one of them exists.


                    The first valid payment instrument in the list will be presented to the customer as the default option. Alternatively, you can explicitly specify a default payment instrument by providing its ID in the `payment_method_configuration.stored_card.default_instrument_id` field.

                    '
                default_instrument_id:
                  pattern: ^(src)_(\w{26})$
                  type: string
                  description: The unique identifier for the payment instrument to present to the customer as the default option.
              description: Configuration options specific to stored card payments.
          description: Configuration options for specific payment methods.
    PhoneNumber:
      type: object
      properties:
        country_code:
          maxLength: 7
          minLength: 1
          type: string
          description: The international <a href="https://www.checkout.com/docs/resources/codes/country-codes" target="_blank">country calling code</a>. Required if `source.type` is `tamara`.
          example: '+1'
        number:
          maxLength: 25
          minLength: 6
          type: string
          description: The phone number. Required if `source.type` is `tamara`.
          example: 415 555 2671
      description: A phone number
    PaymentInterfacesReference:
      maxLength: 50
      type: string
      description: "A reference you can use to identify the payment. For example, an order number. \n  - For Amex payments, this must be at most 30 characters.\n  - For Benefit payments, the reference must be a unique alphanumeric value.\n  - For iDEAL payments, the reference is required and must be an alphanumeric value with a 35-character limit.\n"
      example: ORD-123A
  securitySchemes:
    ApiPublicKey:
      type: apiKey
      description: "Public keys are for client-side authentication and supported only in JavaScript or native applications.\n  \n#### Format\n\n- Sandbox – `pk_sbox_xxxxxxxxxxxxxxxxxxxxxxxxxx`\n\n- Production – `pk_xxxxxxxxxxxxxxxxxxxxxxxxxx`\n\nWhen specifying your public key, use the format `Bearer {{PublicApiKey}}`.\n"
      name: Authorization
      in: header
      x-cko-type: publicKey
    ApiSecretKey:
      type: apiKey
      description: 'You can pass your secret API key in the `Authorization` header of your requests for supported endpoints.


        #### Format


        - Sandbox – `sk_sbox_xxxxxxxxxxxxxxxxxxxxxxxxxx`


        - Production – `sk_xxxxxxxxxxxxxxxxxxxxxxxxxx`


        When specifying your secret key, use the format `Bearer {{SecretApiKey}}`.


        ```

        curl --location --request POST ''https://{prefix}.api.checkout.com/{{path}}'' \

        --header ''Content-Type: application/json'' \

        --header ''Accept: application/json'' \

        --header ''Authorization: Bearer {{SecretApiKey}}'' \

        --data-raw ''{

        "amount": 10000,

        "currency": "USD",

        "reference": "Visa-USD-Test",

        ...

        }''

        ```

        '
      name: Authorization
      in: header
      x-cko-type: secretKey
    OAuth:
      type: oauth2
      description: "Your OAuth credentials include an access key ID and an access key secret. They correspond to an OAuth 2.0 client ID and a client secret respectively. \n\nTo exchange these credentials for an access token, call the [Request an access token](/tag/access/POST/connect/token) endpoint. Authenticate using basic authentication, with your access key ID as the username and your access key secret as the password.\n\n| Environment   |      Authorization server                            |\n|---------------|------------------------------------------------------|\n| Sandbox       |  https://{prefix}.access.sandbox.checkout.com/connect/token   |\n| Production    |  https://{prefix}.access.checkout.com/connect/token           |\n\n```\ncurl --location 'https://{prefix}.access.checkout.com/connect/token' \\\n--header 'Content-Type: application/x-www-form-urlencoded' \\\n--data-urlencode 'grant_type=client_credentials' \\\n--data-urlencode 'client_id=ack_...' \\\n--data-urlencode 'client_secret=...' \n```\n\nThe token server returns a Bearer `access_token` in JSON Web Token (JWT) format. Use this token in the `Authorization` header of your API requests.\n\n```\ncurl --location --request POST 'https://{prefix}.api.checkout.com/{{path}}' \\\n--header 'Content-Type: application/json' \\\n--header 'Accept: application/json' \\\n--header 'Authorization: Bearer {{AccessToken}}' \\\n--data-raw '{\n  \"amount\": 10000,\n  \"currency\": \"USD\",\n  \"reference\": \"Visa-USD-Test\",\n  ...\n}'\n```\n\nThe `expires_in` field in the response indicates the validity period of your access token in seconds. When your token expires, you must request a new one.\n\nDepending on the Environment against which you're making your requests against you'll need to request the token from a different Authorization Server.\n\n| Environment   |      Authorization Server                            |\n|---------------|------------------------------------------------------|\n| Sandbox       |  https://{prefix}.access.sandbox.checkout.com/connect/token   |\n| Production    |  https://{prefix}.access.checkout.com/connect/token           |\n\nYour base URL `{prefix}` is unique. To learn how to retrieve your unique base URLs for the sandbox and production environments, see [API endpoints](https://www.checkout.com/docs/developer-resources/api/api-endpoints).\n"
      flows:
        clientCredentials:
          tokenUrl: string
