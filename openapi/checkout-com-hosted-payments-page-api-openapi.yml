            description: "The split amount - this will be credited to your sub-entity's currency account. The sum of all split amounts must be equal to the payment amount.      \n\nThe amount must be provided in the <a href=\"https://www.checkout.com/docs/resources/calculating-the-amount\" target=\"blank\">minor currency unit</a>.\n"
            format: int64
            example: 1000
          reference:
            maxLength: 50
            type: string
