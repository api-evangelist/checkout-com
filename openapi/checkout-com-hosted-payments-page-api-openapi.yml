            example: '2023-06-20T00:00:00.0000000'
          check_out_date:
            type: string
            description: For lodging, contains the actual or scheduled date the guest checked-out. For cruise, contains the cruise return date also known as sail end date.
            format: date
            example: '2023-06-23T00:00:00.0000000'
          address:
            type: object
            properties:
              address_line1:
                type: string
