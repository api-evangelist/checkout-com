          description: The certification data. The properties returned depend on the certification `type`.
      description: The details of a certification associated with the identity verification.
      readOnly: true
    IdvIdentity:
      required:
      - full_name
      - birth_date
      type: object
      properties:
        full_name:
          maxLength: 510
          minLength: 2
          type: string
          description: The applicant's full name.
          readOnly: true
        first_names:
          maxLength: 255
          minLength: 1
          type: string
          description: The applicant's first names.
          readOnly: true
        last_name:
          maxLength: 255
          minLength: 1
          type: string
          description: The applicant's last name.
          readOnly: true
        last_name_at_birth:
          maxLength: 255
          minLength: 1
          type: string
          description: The applicant's last name at birth.
          readOnly: true
        birth_date:
          type: string
