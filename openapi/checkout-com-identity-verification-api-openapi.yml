      - terminated
      type: string
      description: The [attempt status](https://www.checkout.com/docs/developer-resources/codes/identities-codes#Attempt_statuses).
      readOnly: true
    IdvAttemptLinks:
      type: object
      allOf:
      - $ref: '#/components/schemas/IdvSelfLink'
      - $ref: '#/components/schemas/IdvActiveLink'
