          example: FR
        pre_selected_document_issuing_country:
          pattern: ^[A-Z]{2}
          type: string
          description: The country that issued the applicant's identity document. <br/>Standard – [ISO alpha-2 country code](/developer-resources/codes/country-codes) <br/>Example – `FR`
