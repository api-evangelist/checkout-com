            required: true
          - id: account_holder.last_name
            type: string
            display: First name
            description: The account holder's last name
            section: account
            required: true
    Address:
      type: object
      properties:
        address_line1:
          maxLength: 200
          type: string
          description: The first line of the address.
          example: 123 High St.
        address_line2:
          maxLength: 200
          type: string
          description: "The second line of the address. <p/>\n\n For SEPA payments, this value has a maximum length of 10 characters.\n"
          example: Flat 456
        city:
          maxLength: 50
          type: string
          description: The address city.
          example: London
        state:
          maxLength: 3
          type: string
          description: 'The state or province of the address country <a href="https://en.wikipedia.org/wiki/ISO_3166-2" target="_blank">ISO 3166-2 code</a> (for example: CA for California in the United States).'
        zip:
          maxLength: 50
          type: string
          description: The address zip or postal code.
          example: SW1A 1AA
        country:
          maxLength: 2
          minLength: 2
          type: string
          description: The two-letter <a href="https://www.checkout.com/docs/resources/codes/country-codes" target="_blank">ISO country code</a> of the address.
          example: GB
    StoreInstrumentRequest:
      required:
      - type
      type: object
