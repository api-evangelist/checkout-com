                  value:
                    type: bank_account
                    fingerprint: smoua2sbuqhupeofwbe77n5nsm
                sepa:
                  value:
                    type: sepa
                    id: src_wmlfc3zyhqzehihu7giusaaawu
                    fingerprint: vnsdrvikkvre3dtrjjvlm5du4q
                ach:
                  value:
                    type: ach
                    id: src_wmlfc3zyhqzehihu7giusaaawu
                    fingerprint: vnsdrvikkvre3dtrjjvlm5du4q
                bacs:
                  value:
                    type: bacs
                    id: src_wmlfc3zyhqzehihu7giusaaawu
                    fingerprint: vnsdrvikkvre3dtrjjvlm5du4q
        '401':
