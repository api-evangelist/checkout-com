    UpdateBacsInstrumentRequest:
      title: bacs
      type: object
      properties:
        type:
          type: string
          description: The type of instrument. `bacs` payment instruments.
        instrument_data:
          type: object
          properties:
            account_number:
              maxLength: 8
              minLength: 8
              type: string
              description: The account number of the Bacs Direct Debit account.
              example: '86753246'
            bank_code:
              maxLength: 6
              minLength: 6
              type: string
              description: The sort code of the Bacs Direct Debit account.
              example: '040004'
            country:
              maxLength: 2
              minLength: 2
              type: string
              description: The country of the account, as an ISO 3166-1 alpha-2 code.
              example: GB
            currency:
              maxLength: 3
              minLength: 3
              type: string
              description: The currency of the account.
              example: GBP
            payment_type:
              enum:
              - Recurring
              - Regular
              type: string
              description: The type of payment. `Recurring` or `Regular`.
              example: Recurring
            allow_partial_match:
              type: boolean
              description: Whether vault accepted a partial match when looking up the Bacs instrument for the supplied account details.
              example: true
          description: The details of the Bacs Direct Debit account.
        account_holder:
          type: object
          properties:
            first_name:
              type: string
              description: 'The first name of the account holder

                '
              example: John
            last_name:
              type: string
              description: 'The last name of the account holder

                '
              example: Smith
            company_name:
              maxLength: 50
              type: string
              description: The legal name of a registered company that holds the account.
            billing_address:
              type: object
              properties:
                address_line1:
                  maxLength: 200
                  type: string
                  description: The first line of the address.
                  example: Cloverfield St.
                address_line2:
                  maxLength: 10
                  type: string
                  description: The street number. If no number, pass "w/n".
                  example: 23A
                city:
                  maxLength: 50
                  type: string
                  description: The address city.
                  example: London
                zip:
                  maxLength: 50
                  type: string
                  description: The address zip/postal code.
                  example: SW1A 1AA
                country:
                  maxLength: 2
                  minLength: 2
                  type: string
                  description: The two-letter <a href="https://www.checkout.com/docs/resources/codes/country-codes" target="_blank">ISO country code</a> of the address.
                  example: GB
              description: The billing address of the account holder
            type:
              enum:
              - individual
              - corporate
              type: string
              description: The type of account holder.
              example: corporate
          description: The account holder details
      description: Update Bacs Direct Debit account details
    StoreCustomerInstrumentRequest:
      type: object
      properties:
        id:
          pattern: ^(cus)_(\w{26})$
