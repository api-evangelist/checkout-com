          pattern: ^([a-z0-9]{26})$
          type: string
          description: A token that can uniquely identify this instrument across all customers.
          example: vnsdrvikkvre3dtrjjvlm5du4q
        created_on:
          type: string
          description: The date and time the instrument was created.
          format: date-time
          example: '2021-01-01T00:00:00.0000000+00:00'
        modified_on:
          type: string
          description: The date and time the instrument was last modified.
          format: date-time
          example: '2021-01-01T00:00:00.0000000+00:00'
        vault_id:
          type: string
          description: The Vault ID currently attached to the instrument.
          example: vid_wmlfc3zyhqzehihu7giusaaawu
        instrument_data:
          required:
          - country
          - account_number
          - currency
          - payment_type
          - mandate_id
          - date_of_signature
          type: object
          properties:
            type:
              enum:
              - Core
              - B2B
              type: string
              description: The type of mandate.
              example: B2B
            account_number:
              maxLength: 34
              minLength: 15
              type: string
              description: The International Bank Account Number (IBAN) of the account.
              example: FR2810096000509685512959O86
            country:
              maxLength: 2
              minLength: 2
              type: string
              description: The country of the account.
              example: GB
            currency:
              maxLength: 3
              minLength: 3
              type: string
              description: The currency of the account.
              example: GBP
            payment_type:
              enum:
              - recurring
              - regular
              type: string
              description: The type of payment.
              example: recurring
            mandate_id:
              maxLength: 35
              minLength: 1
              type: string
              description: 'The mandate ID.


                If this value was not provided when the instrument was created, it may take up to five seconds for the generated mandate ID to be available.

                '
              example: '1234567890'
            date_of_signature:
              maxLength: 10
              minLength: 10
              type: string
              description: 'The date the mandate was signed.


                If `mandate_id` was not provided when the instrument was created, it may take up to five seconds for the generated date of signature to be available.

                '
              format: date
              example: '2021-01-01T00:00:00.0000000'
          description: The details of the SEPA mandate.
        account_holder:
          required:
          - first_name
          - last_name
          - billing_address
          type: object
          properties:
            first_name:
              type: string
              description: The first name of the account holder.
              example: Hannah
            last_name:
              type: string
              description: The last name of the account holder.
              example: Bret
            billing_address:
              required:
              - address_line1
              - address_line2
              - city
              - zip
              - country
              type: object
              properties:
                address_line1:
                  type: string
                  description: The first line of the address.
                  example: 123 High St.
                address_line2:
                  type: string
                  description: The second line of the address.
                  example: Flat 456
                city:
                  type: string
                  description: The address city.
                  example: London
                zip:
                  type: string
                  description: The address ZIP or postal code.
                  example: SW1A 1AA
                country:
                  maxLength: 2
                  minLength: 2
                  type: string
                  description: The address country.
                  example: GB
              description: The billing address of the account holder.
            company_name:
              maxLength: 50
              type: string
              description: The legal name of a registered company that holds the account.
            type:
              enum:
              - individual
              - corporate
              type: string
              description: The type of account holder.
              example: corporate
          description: The account holder's details.
        customer:
          $ref: '#/components/schemas/RetrieveInstrumentCustomerResponse'
