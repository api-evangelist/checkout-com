        content:
          type: string
          description: 'The base64-encoded string that represents a single JPG, PDF, TIFF, or ZIP file.

            ZIP files can contain multiple JPG, PDF, or TIFF files.

            '
        description:
          type: string
          description: A brief description of the evidence.
          example: Goods were not received.
    IssuingValidationError:
      type: object
      properties:
        request_id:
          type: string
          example: 0HLHPN8802NUF:00000003
        error_type:
          type: string
          example: request_invalid
        error_codes:
          maxItems: 20
          type: array
          items:
            type: string
            example: request_body_malformed
      additionalProperties: false
    IssuingLink:
      required:
      - href
