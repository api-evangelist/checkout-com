          additionalProperties: false
          description: The HTTP Methods that can be performed on the link.
        types:
          type: array
          items:
            maxLength: 100
            pattern: ^application\/.*$
            type: string
          additionalProperties: false
          description: The Content Types for the link to the resource
      additionalProperties: false
    IssuingDisputeReasonChange:
      required:
      - reason
      - justification
      type: object
      properties:
        reason:
          type: string
          description: 'The updated four-digit scheme-specific [reason code](https://www.checkout.com/docs/developer-resources/codes/chargeback-codes) for the chargeback.

            '
          example: '4807'
        justification:
          maxLength: 13000
          type: string
          description: Your justification for changing the dispute reason.
      description: The change to the dispute reason and your justification for changing it.
    IssuingDisputeMerchant:
      type: object
      properties:
        id:
          type: string
          description: The merchant's identifier. This can vary from one acquirer to another.
          example: (*)123456789
        name:
          type: string
          description: The merchant's name.
          example: Software Company
        city:
          type: string
          description: The city where the merchant is located.
          example: Paris
        state:
          type: string
          description: The state where the merchant is located (US only).
          example: ''
        country_code:
          type: string
          description: The two-digit [country code](https://www.checkout.com/docs/developer-resources/codes/country-codes) where the merchant is located.
          example: FR
        category_code:
          type: string
          description: 'The merchant''s [category code](https://www.checkout.com/docs/developer-resources/testing/codes/merchant-category-codes) for the disputed transaction.

            '
          example: '5331'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/IssuingFileId'
          description: Any evidence submitted by the merchant during the dispute lifecycle.
    IssuingCurrency:
      maxLength: 3
      minLength: 3
      pattern: ^[a-zA-Z]{3}$
      type: string
      description: The issuing currency, as a three-letter <a href="https://docs.checkout.com/docs/currency-codes" target="blank">ISO currency code</a>.
      format: ISO4217
      example: USD
    IssuingDisputeStatusReason:
      enum:
      - ''
      - expired
      - chargeback_pending
      - chargeback_change_requested
      - chargeback_evidence_invalid_or_insufficient
      - chargeback_processed
      - chargeback_rejected
      - chargeback_reversal_pending
      - chargeback_reversed
      - chargeback_response_accepted
      - prearbitration_pending
      - escalation_change_requested
      - prearbitration_evidence_invalid_or_insufficient
      - prearbitration_processed
      - prearbitration_rejected
      - prearbitration_reversal_pending
      - prearbitration_reversed
      - prearbitration_response_accepted
      - arbitration_pending
      - arbitration_processed
      - presentment_reversed
      type: string
      description: The status reason as returned to the client. An empty string indicates no status reason currently applies.
      example: chargeback_processed
    get-dispute-response:
      type: object
      allOf:
      - $ref: '#/components/schemas/IssuingDispute'
      description: The client's dispute response.
    IssuingDisputeActionDetails:
      type: object
      properties:
        instructions:
          type: string
          description: 'The amendments required before the dispute can proceed. For example, if you need to provide a reason code, or update the submitted evidence.

            '
        last_action_response:
          type: string
          description: 'Specifies whether the dispute was previously amended and an action response was provided.

            '
      description: 'Provides instructions on the amendments required before the dispute can proceed, if the dispute `status` is `action_required`.


        Use the <a target="_blank" href="https://api-reference.checkout.com/tag/Issuing-disputes#operation/amendDispute">Amend an Issuing dispute</a> endpoint to submit your amendments.

        Use the correct endpoint to send your updates as requested.

        '
    IssuingDisputePreArbitration:
      type: object
      properties:
        submitted_on:
          type: string
          description: The date and time when the pre-arbitration was successfully escalated to the card scheme, in UTC. <br/>Format – ISO 8601 code <br/>Example – `2025-01-31T10:20:30.456`
          format: date-time
          example: '2025-09-10T10:11:12.0000000+00:00'
        evidence:
          type: array
          items:
            required:
            - file_id
            type: object
            properties:
              file_id:
                allOf:
                - $ref: '#/components/schemas/IssuingFileId'
                description: The unique identifier for an uploaded file.
              description:
                type: string
                description: A brief description of the evidence.
                example: Goods were not received.
          description: The evidence relating to the Issuing dispute provided at the pre-arbitration stage.
        amount:
          allOf:
          - $ref: '#/components/schemas/IssuingTransactionAmount'
          description: The disputed amount at the pre-arbitration stage, in the [minor currency unit](https://www.checkout.com/docs/payments/accept-payments/format-the-payment-amount).
        reason_change:
          allOf:
          - $ref: '#/components/schemas/IssuingDisputeReasonChange'
          description: The change to the dispute reason and your justification for changing it.
        justification:
          type: string
          description: Your justification for escalating the dispute to pre-arbitration.
        merchant_responded_on:
          type: string
          description: The date and time when the merchant provided evidence against the pre-arbitration, in UTC. <br/>Format – ISO 8601 code <br/>Example – `2025-01-31T10:20:30.456`
          format: date-time
        merchant_evidence:
          type: array
          items:
            required:
            - file_id
            type: object
            properties:
              file_id:
                allOf:
                - $ref: '#/components/schemas/IssuingFileId'
                description: The unique identifier for an uploaded file.
              description:
                type: string
                description: A brief description of the evidence.
                example: Goods were not received.
            description: 'The evidence provided by the merchant against the pre-arbitration case.

              '
      description: The dispute details at the pre-arbitration stage.
    IssuingDisputeSecondPresentment:
      type: object
      properties:
        received_on:
          type: string
          description: The date and time when you received the representment, in UTC. <br/>Format – ISO 8601 code <br/>Example – `2025-01-31T10:20:30.456`
          format: date-time
        amount:
          allOf:
          - $ref: '#/components/schemas/IssuingTransactionAmount'
          description: The representment amount, in the [minor currency unit](https://www.checkout.com/docs/payments/accept-payments/format-the-payment-amount).
        evidence:
          type: array
          items:
            required:
            - file_id
            type: object
            properties:
              file_id:
                allOf:
                - $ref: '#/components/schemas/IssuingFileId'
                description: The unique identifier for an uploaded file.
              description:
                type: string
                description: A brief description of the evidence.
                example: Goods were not received.
          description: The evidence provided by the merchant against the chargeback.
      description: The information provided by the merchant when they reject the chargeback and send a representment.
    IssuingDisputeFraudDetails:
      required:
      - fraud_type
      type: object
      properties:
        fraud_type:
          enum:
          - card_lost
          - card_stolen
          - card_never_received
          - fraudulent_account
          - counterfeit_card
          - account_takeover
          - card_not_present_fraud
          - merchant_misrepresentation
          - cardholder_manipulation
          - incorrect_processing
          - other
          type: string
          description: "The type of fraud the cardholder is asserting. This can be one of:\n  - `card_lost`: The cardholder does not have the physical card and cannot explain how it was lost.\n  - `card_stolen`: The cardholder does not have the physical card and provided an explanation as to how it was lost. For example, their wallet was stolen.\n  - `card_never_received`: The card was issued and mailed but was not received by the cardholder.\n  - `fraudulent_account`: The account was opened fraudulently using a stolen, fake, or synthetic identity.\n  - `counterfeit_card`: The cardholder has their physical card but a duplicate or altered card was used in an unauthorized card-present transaction.\n  - `account_takeover`: A fraudster gained control of the cardholder's account or credentials. For example, they may have changed the registered address, ordered a new card, or provisioned the card to a digital wallet.\n  - `card_not_present_fraud`: The cardholder still has the card but the card details were used in an unauthorized card-not-present transaction. For example, it was used in an ecommerce transaction, or in a mail order/telephone order (MOTO) payment.\n  - `merchant_misrepresentation`: The merchant deliberately misled the cardholder. For example, the goods provided were sub-standard, there were hidden charges, or the services advertised were fake.\n  - `cardholder_manipulation`: The cardholder was tricked into authorizing the transaction themselves. For example, due to a scam, an impersonation, or authorized push payment (APP) fraud.\n  - `incorrect_processing`: A security check failed and made fraudulent activity possible. For example, a card verification value (CVV) check was not performed, or the EMV cryptogram was not validated.\n  - `other`: The confirmed fraud does not fit any of the other fraud type categories, or there were multiple fraud types applicable to the same transaction.\n"
          example: card_not_present_fraud
        description:
          maxLength: 3000
          type: string
          description: A description of the fraud circumstances, for internal reference. This is not forwarded to the scheme.
          example: Cardholder confirmed they made no online purchases on this date.
      description: Fraud-related information required when the dispute reason code is fraud-related.
    IssuingDisputeId:
      maxLength: 31
      minLength: 31
      pattern: ^idsp_[a-z0-9]{26}$
      type: string
      description: The unique identifier for the Issuing dispute.
      example: idsp_fa6psq242dcd6fdn5gifcq1491
    amend-dispute-request:
      type: object
      properties:
        reason:
          type: string
          description: 'The updated four-digit scheme-specific [reason code](https://www.checkout.com/docs/developer-resources/codes/chargeback-codes#Mastercard).

            If a value is not provided, the existing reason code is retained.

            '
          example: '4807'
        amount:
          type: number
          description: 'The updated disputed amount, in the [minor unit](https://www.checkout.com/docs/payments/accept-payments/format-the-payment-amount)

            of the transaction currency. If not provided, the existing amount is retained.

            '
          example: 1500
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/IssuingDisputeEvidence'
          description: 'The updated or additional evidence requested by the Dispute Resolution team.

            Follow the [card scheme''s requirements](https://www.checkout.com/docs/card-issuing/manage-cardholder-transactions/manage-issuing-disputes#Evidence_file_requirements).

            '
        fraud_details:
          allOf:
          - $ref: '#/components/schemas/IssuingDisputeFraudDetails'
          description: 'Provides the fraud category, and additional context if available.


            This field is required if `reason` specifies a fraud-related dispute.

            '
        reason_change_justification:
          maxLength: 13000
          type: string
          description: 'Explains the justification for the reason change. This is shared with the Dispute Resolution review team and may be submitted to the card scheme.

            This field is required if you change the `reason` at the escalation stage.

            '
          example: New evidence confirms this was an unauthorized transaction, making reason 4837 more appropriate.
        action_response:
          maxLength: 1000
          type: string
          description: 'Free-form text that you can use to explain your choices, provide additional context, or ask questions about the requested changes.

            '
          example: Updated reason as requested. The cardholder confirmed the goods were never delivered.
      description: 'Submit an amendment to a dispute that is currently blocked from proceeding. This endpoint

        handles both chargeback-stage and escalation-stage amendments using the same flat payload

        as the server determines the context from the dispute''s current state.


        Refer to the `action_details` returned in the <a target="_blank" href="https://api-reference.checkout.com/tag/Issuing-disputes#operation/getDispute">Get issuing dispute</a> endpoint to view the instructions provided by the Dispute Resolution team and the deadline by which you must submit amendments.


        If `reason` specifies a fraud-related dispute, you must provide `fraud_details`.

        If you change the `reason` at the escalation stage,  you must provide `reason_change_justification`.

        '
  headers:
    Cko-Request-Id:
      description: The unique identifier of the request
      schema:
        type: string
  parameters:
    IssuingCkoIdempotencyKeyRequired:
      name: Cko-Idempotency-Key
      in: header
      description: An idempotency key for safely retrying requests.
      required: true
      schema:
        maxLength: 256
        minLength: 1
        pattern: ^[A-Za-z0-9._-]+$
        type: string
      example: 7c1b9f96-4f2e-4b1a-bc2b-3d0f1a2e9f3a
  securitySchemes:
    ApiPublicKey:
      type: apiKey
      description: "Public keys are for client-side authentication and supported only in JavaScript or native applications.\n  \n#### Format\n\n- Sandbox – `pk_sbox_xxxxxxxxxxxxxxxxxxxxxxxxxx`\n\n- Production – `pk_xxxxxxxxxxxxxxxxxxxxxxxxxx`\n\nWhen specifying your public key, use the format `Bearer {{PublicApiKey}}`.\n"
      name: Authorization
      in: header
      x-cko-type: publicKey
    ApiSecretKey:
      type: apiKey
      description: 'You can pass your secret API key in the `Authorization` header of your requests for supported endpoints.


        #### Format


        - Sandbox – `sk_sbox_xxxxxxxxxxxxxxxxxxxxxxxxxx`


        - Production – `sk_xxxxxxxxxxxxxxxxxxxxxxxxxx`


        When specifying your secret key, use the format `Bearer {{SecretApiKey}}`.


        ```

        curl --location --request POST ''https://{prefix}.api.checkout.com/{{path}}'' \

        --header ''Content-Type: application/json'' \

        --header ''Accept: application/json'' \

        --header ''Authorization: Bearer {{SecretApiKey}}'' \

        --data-raw ''{

        "amount": 10000,

        "currency": "USD",

        "reference": "Visa-USD-Test",

        ...

        }''

        ```

        '
      name: Authorization
      in: header
      x-cko-type: secretKey
    OAuth:
      type: oauth2
      description: "Your OAuth credentials include an access key ID and an access key secret. They correspond to an OAuth 2.0 client ID and a client secret respectively. \n\nTo exchange these credentials for an access token, call the [Request an access token](/tag/access/POST/connect/token) endpoint. Authenticate using basic authentication, with your access key ID as the username and your access key secret as the password.\n\n| Environment   |      Authorization server                            |\n|---------------|------------------------------------------------------|\n| Sandbox       |  https://{prefix}.access.sandbox.checkout.com/connect/token   |\n| Production    |  https://{prefix}.access.checkout.com/connect/token           |\n\n```\ncurl --location 'https://{prefix}.access.checkout.com/connect/token' \\\n--header 'Content-Type: application/x-www-form-urlencoded' \\\n--data-urlencode 'grant_type=client_credentials' \\\n--data-urlencode 'client_id=ack_...' \\\n--data-urlencode 'client_secret=...' \n```\n\nThe token server returns a Bearer `access_token` in JSON Web Token (JWT) format. Use this token in the `Authorization` header of your API requests.\n\n```\ncurl --location --request POST 'https://{prefix}.api.checkout.com/{{path}}' \\\n--header 'Content-Type: application/json' \\\n--header 'Accept: application/json' \\\n--header 'Authorization: Bearer {{AccessToken}}' \\\n--data-raw '{\n  \"amount\": 10000,\n  \"currency\": \"USD\",\n  \"reference\": \"Visa-USD-Test\",\n  ...\n}'\n```\n\nThe `expires_in` field in the response indicates the validity period of your access token in seconds. When your token expires, you must request a new one.\n\nDepending on the Environment against which you're making your requests against you'll need to request the token from a different Authorization Server.\n\n| Environment   |      Authorization Server                            |\n|---------------|------------------------------------------------------|\n| Sandbox       |  https://{prefix}.access.sandbox.checkout.com/connect/token   |\n| Production    |  https://{prefix}.access.checkout.com/connect/token           |\n\nYour base URL `{prefix}` is unique. To learn how to retrieve your unique base URLs for the sandbox and production environments, see [API endpoints](https://www.checkout.com/docs/developer-resources/api/api-endpoints).\n"
      flows:
        clientCredentials:
          tokenUrl: string
