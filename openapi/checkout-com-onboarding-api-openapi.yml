    EEACompanyFull3-0:
      title: EEA Company - Full (3.0)
      required:
      - reference
      - company
      - profile
      - documents
      - processing_details
      type: object
      properties:
        reference:
          title: Unique reference
          maxLength: 50
          minLength: 1
          type: string
          description: A unique reference you can later use to identify the sub-entity.
        status:
          type: string
          readOnly: true
        is_draft:
          type: boolean
          description: 'Specifies whether the sub-entity details are in draft.


            Marking a sub-entity as a draft allows sub-entity details to be updated, without triggering due diligence checks.'
          writeOnly: true
        profile:
          title: Profile
          required:
          - urls
          - mccs
          - default_holding_currency
          - holding_currencies
          type: object
          properties:
            urls:
              title: Website
              maxItems: 100
              type: array
              items:
                title: Company website URL
                maxLength: 300
                minLength: 4
                pattern: ^(http|https):\//\S{2,293}$
                type: string
                description: The URL of the company's website.
                format: uri
              description: A collection of website URLs the sub-entity accepts payments on.
            mccs:
              title: Industry
              maxItems: 5
              minItems: 1
              type: array
              items:
                title: Merchant category code
                pattern: ^[0-9]{4}$
