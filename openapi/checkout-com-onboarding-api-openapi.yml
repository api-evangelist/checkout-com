                description: The URL of the company's website.
                format: uri
              description: The collection of website URLs the sub-entity accepts payments on.
            mccs:
              title: Industry
              maxItems: 5
              minItems: 1
              type: array
              items:
                title: Merchant category code
                pattern: ^[0-9]{4}$
