      security:
      - OAuth:
        - accounts
      - ApiSecretKey: []
    put:
      tags:
      - Onboarding
      summary: Resolve a requirement
      description: 'Submit a response to resolve a requirement. The shape of `value` is defined by the requirement''s `_schema`, returned from `GET /accounts/entities/{id}/requirements/{requirementId}`.


        The response is accepted for processing and applied asynchronously. While processing, the requirement is no longer retrievable via the GET endpoints; if validation fails downstream the requirement may reappear.'
      operationId: resolveEntityRequirement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityRequirementUpdateRequest'
            example:
              value: Acme Holdings Limited
        required: true
      responses:
        '202':
          description: Response accepted for processing
          headers:
            Cko-Version:
              $ref: '#/components/headers/Cko-Version'
            Cko-Request-Id:
              $ref: '#/components/headers/Cko-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityRequirementUpdateResponse'
              example:
                id: req_5wmacwhrhbzhqkhx5hlqmzje44
                status: processing
                submitted_at: '2026-05-05T10:15:30.0000000+00:00'
                _links:
                  self:
                    href: https://{prefix}.api.checkout.com/accounts/entities/ent_wxglze3wwywujg4nna5fb7ldli/requirements/req_5wmacwhrhbzhqkhx5hlqmzje44
                  collection:
                    href: https://{prefix}.api.checkout.com/accounts/entities/ent_wxglze3wwywujg4nna5fb7ldli/requirements
        '400':
          description: The request body could not be parsed.
        '401':
          description: Unauthorized
        '404':
          description: Requirement not found, or a response has already been submitted for it.
        '422':
          description: The supplied `value` did not validate against the requirement's `_schema`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - OAuth:
        - accounts
      - ApiSecretKey: []
