          description: The phone number. Required if `source.type` is `tamara`.
          example: 415 555 2671
      description: A phone number
    PaymentContext:
      required:
      - source
      - currency
      - amount
      type: object
      properties:
        source:
          $ref: '#/components/schemas/PaymentContextSource'
        amount:
          minimum: 0
          type: integer
          description: 'The Payment Context Payment amount.

            The amount must be provided in the <a href="https://www.checkout.com/docs/resources/calculating-the-amount" target="blank">minor currency unit</a>.

            '
          example: 6540
        currency:
          maxLength: 3
          minLength: 3
          type: string
          description: 'The three-letter <a href="https://www.checkout.com/docs/resources/codes/currency-codes" target="blank">ISO currency code</a>.

            '
          example: USD
        payment_type:
          enum:
          - Regular
          - Recurring
          type: string
          description: '"Recurring" must be specified if the payment is paid in multiple installments.

            '
          default: Regular
          example: Recurring
        capture:
          type: boolean
          description: Whether to capture the later payment (if applicable).
          default: true
          example: true
        customer:
          $ref: '#/components/schemas/PaymentContextDetailsCustomer'
        shipping:
          $ref: '#/components/schemas/Shipping'
        processing:
          allOf:
          - $ref: '#/components/schemas/PaymentContextProcessing'
          description: Use the processing object to influence or override the data during the payment processing.
        processing_channel_id:
          pattern: ^(pc)_(\w{26})$
          type: string
          description: The processing channel to be used for the payment.
          example: pc_q4dbxom5jbgudnjzjpz7j2z6uq
        reference:
          maxLength: 50
          type: string
          description: 'A reference you can later use to identify this Payment Context, such as an order number.<br>Can only be alphanumeric and must be unique for Benefit.<br>For Amex, the string limit is 30 characters.

            '
          example: ORD-5023-4E89
        description:
          maxLength: 100
          type: string
          description: A description of the Payment Context.
          example: Set of 3 masks
        success_url:
          maxLength: 1024
          type: string
          description: For redirect payment methods, this overrides the default success redirect URL configured on your account.
          format: uri
          example: https://example.com/payments/success
        failure_url:
          maxLength: 1024
          type: string
          description: For redirect payment methods, this overrides the default failure redirect URL configured on your account.
          format: uri
          example: https://example.com/payments/fail
        items:
          $ref: '#/components/schemas/PaymentContextItems'
        metadata:
          type: object
          description: "A set of key-value pairs store additional information about a transaction. You can send custom fields and up to five user-defined fields, which can be used for reporting purposes. You can supply fields of type \n\n- `string`\n- `number`\n- `boolean`\n\nArrays and objects are not supported. \n\nYou can provide up to 20 metadata fields per API call, but the value of each field must not exceed 255 characters in length.\n\nYou can also reference [`metadata` properties](https://www.checkout.com/docs/business-operations/prevent-fraud/understand-fraud-detection#Metadata) in your custom rules for Fraud Detection.\n"
          example:
            coupon_code: NY2018
  parameters:
    ckoIdempotencyKey:
      name: Cko-Idempotency-Key
      in: header
      description: An optional idempotency key for safely retrying payment requests
      schema:
        type: string
  securitySchemes:
    ApiPublicKey:
      type: apiKey
      description: "Public keys are for client-side authentication and supported only in JavaScript or native applications.\n  \n#### Format\n\n- Sandbox – `pk_sbox_xxxxxxxxxxxxxxxxxxxxxxxxxx`\n\n- Production – `pk_xxxxxxxxxxxxxxxxxxxxxxxxxx`\n\nWhen specifying your public key, use the format `Bearer {{PublicApiKey}}`.\n"
      name: Authorization
      in: header
      x-cko-type: publicKey
    ApiSecretKey:
      type: apiKey
      description: 'You can pass your secret API key in the `Authorization` header of your requests for supported endpoints.


        #### Format


        - Sandbox – `sk_sbox_xxxxxxxxxxxxxxxxxxxxxxxxxx`


        - Production – `sk_xxxxxxxxxxxxxxxxxxxxxxxxxx`


        When specifying your secret key, use the format `Bearer {{SecretApiKey}}`.


        ```

        curl --location --request POST ''https://{prefix}.api.checkout.com/{{path}}'' \

        --header ''Content-Type: application/json'' \

        --header ''Accept: application/json'' \

        --header ''Authorization: Bearer {{SecretApiKey}}'' \

        --data-raw ''{

        "amount": 10000,

        "currency": "USD",

        "reference": "Visa-USD-Test",

        ...

        }''

        ```

        '
      name: Authorization
      in: header
      x-cko-type: secretKey
    OAuth:
      type: oauth2
      description: "Your OAuth credentials include an access key ID and an access key secret. They correspond to an OAuth 2.0 client ID and a client secret respectively. \n\nTo exchange these credentials for an access token, call the [Request an access token](/tag/access/POST/connect/token) endpoint. Authenticate using basic authentication, with your access key ID as the username and your access key secret as the password.\n\n| Environment   |      Authorization server                            |\n|---------------|------------------------------------------------------|\n| Sandbox       |  https://{prefix}.access.sandbox.checkout.com/connect/token   |\n| Production    |  https://{prefix}.access.checkout.com/connect/token           |\n\n```\ncurl --location 'https://{prefix}.access.checkout.com/connect/token' \\\n--header 'Content-Type: application/x-www-form-urlencoded' \\\n--data-urlencode 'grant_type=client_credentials' \\\n--data-urlencode 'client_id=ack_...' \\\n--data-urlencode 'client_secret=...' \n```\n\nThe token server returns a Bearer `access_token` in JSON Web Token (JWT) format. Use this token in the `Authorization` header of your API requests.\n\n```\ncurl --location --request POST 'https://{prefix}.api.checkout.com/{{path}}' \\\n--header 'Content-Type: application/json' \\\n--header 'Accept: application/json' \\\n--header 'Authorization: Bearer {{AccessToken}}' \\\n--data-raw '{\n  \"amount\": 10000,\n  \"currency\": \"USD\",\n  \"reference\": \"Visa-USD-Test\",\n  ...\n}'\n```\n\nThe `expires_in` field in the response indicates the validity period of your access token in seconds. When your token expires, you must request a new one.\n\nDepending on the Environment against which you're making your requests against you'll need to request the token from a different Authorization Server.\n\n| Environment   |      Authorization Server                            |\n|---------------|------------------------------------------------------|\n| Sandbox       |  https://{prefix}.access.sandbox.checkout.com/connect/token   |\n| Production    |  https://{prefix}.access.checkout.com/connect/token           |\n\nYour base URL `{prefix}` is unique. To learn how to retrieve your unique base URLs for the sandbox and production environments, see [API endpoints](https://www.checkout.com/docs/developer-resources/api/api-endpoints).\n"
      flows:
        clientCredentials:
          tokenUrl: string
          scopes:
            vault: Access to all Vault resources
            vault:apme-enrollment: Manage Apple Pay Domain Enrollment
            vault:customers: Manage customers
