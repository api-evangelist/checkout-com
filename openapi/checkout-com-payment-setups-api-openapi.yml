              description: The ticket's unique identifier.
              example: 0742464639523
            issue_date:
              type: string
              description: The date the airline ticket was issued.
              format: date
              example: '2025-05-01T00:00:00.0000000'
            issuing_carrier_code:
              type: string
              description: The carrier code of the ticket issuer.
              example: '042'
            travel_package_indicator:
              type: string
              description: "The travel package indicator, as one of the following codes:\n\n  - `A` - Airline flight reservation\n  - `B` - Car rental and airline reservation\n  - `C` - Car rental reservation\n  - `N` - Unknown\n"
              example: A
            travel_agency_name:
              type: string
              description: The name of the travel agency.
              example: Checkout Travel Agents
            travel_agency_code:
              type: string
              description: The IATA or ARC unique identifier for the travel agency that issues the ticket.
              example: '91114362'
          description: Details about the airline ticket.
        passengers:
          type: array
          items:
            type: object
            properties:
              first_name:
                type: string
                description: The passenger's first name.
                example: John
              last_name:
                type: string
                description: The passenger's last name.
                example: Smith
              date_of_birth:
                type: string
                description: The passenger's date of birth.
                format: date
                example: '1990-10-31T00:00:00.0000000'
              address:
                type: object
                properties:
                  country:
                    type: string
                    description: The two-letter ISO country code of the passenger's country of residence.
                    example: GB
                description: Details about the passenger's address.
          description: The list of passengers on the flight.
        flight_leg_details:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/PaymentSetupFlightLegDetails'
          description: The list of flight legs booked by the customer.
        total_number_of_passengers:
          type: integer
          description: The total number of passengers on the booking.
          example: 1
        travel_type:
          type: string
          description: The type of travel. For example, `domestic` or `international`.
          example: international
        trip_type:
          type: string
          description: The type of trip. For example, `one_way` or `round_trip`.
          example: one_way
        refundable:
          type: boolean
          description: Specifies whether the booking is refundable.
          example: true
        delivery_recipient:
          type: string
          description: The recipient the ticket is delivered to.
          example: jane.smith@example.com
        ancillaries:
          type: string
          description: Any additional add-ons purchased with the booking. For example, `extra_baggage`.
          example: extra_baggage
        insurance:
          type: object
          properties:
            type:
              type: string
              description: The type of insurance.
              example: travel
            company:
              type: string
              description: The name of the insurance company.
              example: AXA
            price:
              type: object
              properties:
                amount:
                  type: number
                  description: The insurance amount, in the minor currency unit.
                  example: 500
                currency:
                  type: string
                  description: The currency of the insurance amount, as a three-letter ISO currency code.
                  example: SAR
              description: The price of the insurance.
          description: Details about the travel insurance purchased with the booking.
      description: Details about the airline ticket and flights the customer booked.
