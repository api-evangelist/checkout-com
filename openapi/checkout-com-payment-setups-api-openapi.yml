              type: string
              description: The purpose of the payment.
              example: financial_services
          description: Details about the payment instruction.
        _links:
          minItems: 2
          required:
          - self
          - actions
          type: object
          properties:
            self:
              type: object
              allOf:
              - $ref: '#/components/schemas/Link'
