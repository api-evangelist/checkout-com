          type: boolean
          description: Indicates whether this was a 3D Secure payment downgraded to non-3D Secure (when `attempt_n3d` is specified)
          example: false
        enrolled:
          type: string
          description: "Indicates the 3D Secure enrollment status of the issuer\n  * `Y` - Issuer enrolled\n  * `N` - Customer not enrolled\n  * `U` - Unknown\n"
          example: Y
        signature_valid:
          type: string
          description: Verification to ensure the integrity of the response
          example: Y
        authentication_response:
          $ref: '#/components/schemas/ResponseCode'
        authentication_status_reason:
          type: string
          description: "The response from the Directory Server (DS) or Access Control Server (ACS), which provides information on why you received the given `authentication_response` value. \n\nThis field is only returned as a result of a 3DS2 authentication, and only if the returned `authentication_response` value was not `Y`.\nRefer to our <a href=\"https://www.checkout.com/docs/risk-management/3d-secure/sessions/understand-authentication-failures#Common_authentication_failures\" target=\"_blank\">authentication failures</a> documentation for more information.\n"
        cryptogram:
          type: string
          description: Base64 encoded cryptographic identifier (CAVV) used by the card schemes to validate the integrity of the 3D secure payment data
          example: hv8mUFzPzRZoCAAAAAEQBDMAAAA=
        xid:
          type: string
          description: Unique identifier for the transaction assigned by the MPI
          example: MDAwMDAwMDAwMDAwMDAwMzIyNzY=
        eci:
          type: string
          description: 'The <a href="https://www.checkout.com/docs/developer-resources/codes/eci-values">Electronic Commerce Indicator (ECI)</a> security level returned in the payment''s authentication response.

            '
        version:
          type: string
          description: Indicates the version of 3D Secure that was used for authentication
          example: 2.1.0
        exemption:
          enum:
          - 3ds_outage
          - data_share
          - low_risk_program
          - low_value
          - none
          - other
          - out_of_sca_scope
          - sca_delegation
          - secure_corporate_payment
          - transaction_risk_assessment
          - trusted_listing
          - trusted_listing_prompt
          type: string
          description: Specifies an exemption reason so that the payment is not processed using 3D Secure authentication. Learn more about exemptions in our <a href="https://www.checkout.com/docs/payments/regulation-support/sca-compliance-guide#Possible_SCA_exemptions" target="_blank">SCA compliance guide</a>
          example: low_value
        exemption_applied:
          type: string
          description: Specifies the applied exemption during 3DS authentication
        challenged:
          type: boolean
          description: Indicates whether this session involved a challenge. This will only be set after communication with the scheme is finished.
          example: true
        upgrade_reason:
          type: string
          description: Indicates the reason why the payment was upgraded to 3D Secure.
          example: sca_retry
        trusted_listing:
          type: object
          allOf:
          - $ref: '#/components/schemas/TrustedListing'
          description: The details of the trusted listing status of the merchant
