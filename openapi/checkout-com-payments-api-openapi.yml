      - $ref: '#/components/schemas/03_PayoutRequestGovernmentAccountHolder'
      - $ref: '#/components/schemas/02_PayoutRequestCorporateAccountHolder'
      description: The bank account holder details. Having accurate and complete data improves payout performance (increases success rate and the prevents delays).
      discriminator:
        propertyName: type
        mapping:
          individual: '#/components/schemas/01_PayoutRequestIndividualAccountHolder'
          government: '#/components/schemas/03_PayoutRequestGovernmentAccountHolder'
          corporate: '#/components/schemas/02_PayoutRequestCorporateAccountHolder'
    PaymentRequestBlikSource:
      title: blik
      required:
      - type
      type: object
      properties:
        type:
          type: string
          allOf:
          - $ref: '#/components/schemas/PaymentRequestSourceType'
          - enum:
            - blik
            type: string
          description: The payment source type.
          example: blik
        partner_agreement_id:
          maxLength: 64
          type: string
          description: 'The Blik PAYID identifying an external partner agreement created with another PSP.


            Only used when processing merchant-initiated recurring payments (`merchant_initiated: true`) without a stored Checkout.com source.

            '
          example: blik_payid_123456789
      description: "Blik source. Use this to process Blik payments in Poland.\n\nWhen `source.type` is `blik`:\n  - `currency` must be `PLN`.\n  - `amount` must not exceed `5000000` (in the [minor currency unit](https://www.checkout.com/docs/resources/calculating-the-amount)).\n  - `reference` is limited to 35 characters.\n\nFor customer-initiated payments (`merchant_initiated: false`), provide the customer's 6-digit Blik code in `processing.partner_code`. This applies to one-off (`payment_type: Regular`) payments and to the initial payment of a recurring agreement (`payment_type: Recurring`).\n\nFor merchant-initiated recurring payments (`merchant_initiated: true`), use either:\n  - `source.type: id` with a `source.id` value returned from a previous Blik recurring payment, or\n  - `source.type: blik` with `partner_agreement_id` set to an external Blik PAYID created with another PSP.\n"
    PaymentGetResponseKnetSource:
      title: knet
      required:
      - type
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/PaymentDetailsResponseSourceType'
          - enum:
            - knet
            type: string
          description: The payment source type
        language:
          enum:
          - ar
          - en
          type: string
          description: 'Required for KNet Gateway payments.

            This field enables the issuer''s site to select the consumer''s preferred language. For example, the language selected on the merchant''s site – if the issuer''s site supports it. Code list in accordance with ISO 639-1. (Arabic = ''ar'', English = ''en''). Note that ''ar'' corresponds to ''ARA'' and ''en'' to ''USA''. Both values accepted by KNet Gateway.'
        user_defined_field1:
          type: string
          description: User-defined field that can be used to pass and store any additional transaction data required to be archived with the transaction and available as a searching criterion. Only alphanumeric characters and spaces are allowed.
        user_defined_field2:
          type: string
          description: User-defined field can be used to pass and store any additional transaction data required to be archived with the transaction and available as a searching criterion. Only alphanumeric characters and spaces are allowed.
        user_defined_field3:
          type: string
          description: User-defined field can be used to pass and store any additional transaction data required to be archived with the transaction and available as a searching criterion. Only alphanumeric characters and spaces are allowed. Note that this field must be omitted when the `card_token` field is not empty. This restriction exists because a card token is passed to KNet Gateway as `user_defined_field3`.
        user_defined_field4:
          type: string
          description: User-defined field can be used to pass and store any additional transaction data required to be archived with the transaction and available as a searching criterion. Only alphanumeric characters and spaces are allowed.
        user_defined_field5:
          type: string
          description: User-defined field can be used to pass and store any additional transaction data required to be archived with the transaction and available as a searching criterion. Only alphanumeric characters and spaces are allowed. Note that this field must be omitted when the `ptlf` field is not empty. This restriction exists because a PTLF value is passed to KNet Gateway as `user_defined_field5`.
        card_token:
          pattern: ^[0-9]{8}$
          type: string
          description: This token allows re-usage of card details for multiple payments. This 8-digit token should be generated by a merchant. When a subsequent payment is initialized with the same card token, a customer is presented with two options. The customer can choose to pay with KFast (doesn't need to enter card details again), or with KNet as usual. The payment flow stays the same i.e. a merchant should redirect a customer to the redirect URL which is provided in the payment creation response. Note that `user_defined_field3` must be omitted when the `card_token` field is not empty. This restriction exists because a card token is passed to KNet Gateway as `user_defined_field3`.
        ptlf:
          maxLength: 45
          type: string
          description: This is an ID for merchant PTLF functionality tracking. Only alphanumeric characters are allowed. Note that `user_defined_field5` must be omitted when the `ptlf` field is not empty. This restriction exists because a PTLF value is passed to KNet Gateway as `user_defined_field5`.
        knet_payment_id:
          type: string
          description: The payment identifier assigned by KNet Gateway.
        knet_result:
          type: string
          description: The state of the payment, returned by KNet Gateway after the customer is redirected from the payment page.
        inquiry_result:
          type: string
          description: The state of the payment, returned by KNet Gateway in the response from the payment inquiry. This field is populated in rare cases when the redirection from the payment page did not occur properly.
        bank_reference:
          type: string
          description: The result transaction reference, given by some banks/institutions.
          example: '123456789012'
        knet_transaction_id:
          type: string
          description: The transaction identifier assigned by KNet Gateway.
          example: '1234567890123456'
        auth_code:
          type: string
          description: The resulting authorization code from the issuing bank.
          example: '999554'
        auth_response_code:
          type: string
          description: The auth response code / reason code relating to the issuing bank authorization code.
          example: '5'
        post_date:
          type: string
          description: The transaction date in the authorization system format, with the value defined by the issuing bank, so may not match the actual transaction date. The format is `MMDD`.
          example: '1127'
        avr:
          type: string
          description: The Address Verification Response returned from the address verification service.
          example: A
        error:
          type: string
          description: The KNET error code for transaction processing.
          example: IPAY0100044
        error_text:
          type: string
          description: The KNET text detail for the error, including an error code.
          example: IPAY0100044-Problem occured while loading payment page.
      description: KNet Source
    PartialAuthorization:
