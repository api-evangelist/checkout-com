      properties:
        first_name:
          maxLength: 300
          type: string
          description: The first name of the person receiving the goods or the service.
          example: John
        last_name:
          maxLength: 300
          type: string
          description: The last name of the person receiving the goods or the service.
          example: Smith
        email:
          maxLength: 255
          type: string
          description: The email address associated with the shipping order.
          example: john.smith@example.com
        address:
          allOf:
          - $ref: '#/components/schemas/Address'
          description: The shipping address.
        phone:
          allOf:
          - $ref: '#/components/schemas/PhoneNumber'
          description: The phone number associated with the shipping address.
        from_address_zip:
          maxLength: 10
          type: string
          description: The postal code or zip code of the location being shipped from.
          example: '123456'
        timeframe:
          enum:
          - ElectronicDelivery
          - SameDay
          - Overnight
          - TwoDayOrMore
          type: string
          description: Indicates the merchandise delivery timeframe. The following values will be supported by Checkout.com, otherwise your specific value will be passed through to the provider.
          example: SameDay
        method:
          enum:
          - Digital
          - PickUp
          - BillingAddress
          - OtherAddress
          type: string
          description: Indicates the shipping method chosen for the transaction. The following values will be supported by Checkout.com, otherwise your specific value will be passed through to the provider.
          example: BillingAddress
        delay:
          minimum: 0
          type: integer
          description: The number of days by which the shipping is delayed.
          example: 5
      description: The shipping details.
    BankPayoutResponse:
      title: Bank payout response
      type: object
      properties:
        data:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/BankPayout'
        _links:
          $ref: '#/components/schemas/Links'
    PaymentResponseDestination:
      required:
      - type
      type: object
      oneOf:
      - $ref: '#/components/schemas/PaymentResponseBankAccountDestination'
      description: Payment destination
      discriminator:
        propertyName: type
        mapping:
          bank_account: '#/components/schemas/PaymentResponseBankAccountDestination'
    IdempotentActionResponse:
      required:
      - action_id
      type: object
      properties:
        action_id:
          allOf:
          - $ref: '#/components/schemas/ActionId'
          description: The unique identifier for the previously completed payment action.
        _links:
          minItems: 2
          required:
          - payment
          type: object
          properties:
            payment:
              type: object
              allOf:
              - $ref: '#/components/schemas/Link'
              description: The URI of the refunded payment. Use this to check the status of the payment.
              example:
                href: https://{prefix}.api.checkout.com/payments/pay_y3oqhf46pyzuxjbcn2giaqnb44
          description: Links related to the payment.
          readOnly: true
      description: The response received when you attempt a repeated payment action. For example, if you attempt to refund a payment that is already refunded.
    AmountAllocations:
      maxItems: 50
      minItems: 1
      type: array
      items:
        title: Amount Allocations
        required:
        - id
        - amount
        type: object
        properties:
          id:
            type: string
            description: The id of the sub-entity.
            example: ent_w4jelhppmfiufdnatam37wrfc4
          amount:
            maximum: 9999999999
            minimum: 0
            type: integer
            description: "The split amount - this will be credited to your sub-entity's currency account. The sum of all split amounts must be equal to the payment amount.      \n\nThe amount must be provided in the <a href=\"https://www.checkout.com/docs/resources/calculating-the-amount\" target=\"blank\">minor currency unit</a>.\n"
            format: int64
            example: 1000
          reference:
            maxLength: 50
            type: string
            description: A reference you can later use to identify this split, such as an order number.
            example: ORD-5023-4E89
          commission:
            title: Commission
            type: object
            properties:
              amount:
                minimum: 0
                type: integer
                description: 'Optional fixed amount of commission to collect.


                  The amount must be provided in the <a href="https://www.checkout.com/docs/resources/calculating-the-amount" target="blank">minor currency unit</a>.

                  '
                example: 1000
              percentage:
                maximum: 100
                minimum: 0
                type: number
                description: 'Optional percentage of commission to collect.


                  Supports up to 8 decimal places.

                  '
                example: 1.125
            description: 'Commission you''d like to collect from this split - this will be credited to your currency account. The commission cannot exceed the split amount.


              Commission = (`amount` * `commission.percentage`) + `commission.amount`

              '
      description: The sub-entities that the payment is being processed on behalf of
    AirlineData:
      type: array
      items:
        title: Airline Data
        type: object
        properties:
          ticket:
            type: object
            properties:
              number:
                type: string
                description: The ticket's unique identifier.
                example: 045-21351455613
              issue_date:
                type: string
                description: Date the airline ticket was issued.
                format: date
                example: '2023-05-20T00:00:00.0000000'
              issuing_carrier_code:
                type: string
                description: Carrier code of the ticket issuer.
                example: AI
              travel_package_indicator:
                type: string
                description: C = Car rental reservation, A = Airline flight reservation, B = Both car rental and airline flight reservations included, N = Unknown.
                example: B
              travel_agency_name:
                type: string
                description: The name of the travel agency.
                example: World Tours
              travel_agency_code:
                type: string
                description: The unique identifier from IATA or ARC for the travel agency that issues the ticket.
                example: '01'
            description: Contains information about the airline ticket.
          passenger:
            type: array
            items:
              title: Passenger Data
              type: object
              properties:
                first_name:
                  type: string
                  description: The passenger's first name.
                  example: John
                last_name:
                  type: string
                  description: The passenger's last name.
                  example: White
                date_of_birth:
                  type: string
                  description: The passenger's date of birth.
                  format: date
                  example: '1990-05-26T00:00:00.0000000'
                address:
                  type: object
                  properties:
                    country:
                      type: string
                      description: The two-letter ISO country code of the passenger's country residence.
                      example: US
                  description: Contains information about the passenger's address.
            description: Contains information about the passenger(s) on the flight.
          flight_leg_details:
            title: Flight Leg Details
            type: array
            items:
              type: object
              properties:
                flight_number:
                  type: string
                  description: The flight identifier.
                  example: '101'
                carrier_code:
                  type: string
                  description: The IATA 2-letter accounting code (PAX) that identifies the carrier. This field is required if the airline data includes leg details.
                  example: BA
                class_of_travelling:
                  type: string
                  description: 'A one-letter travel class identifier. The following are common: F = First class, J = Business class, Y = Economy class, W = Premium economy.'
                  example: J
                departure_airport:
                  type: string
                  description: The IATA three-letter airport code of the departure airport. This field is required if the airline data includes leg details.
                  example: LHR
                departure_date:
                  type: string
                  description: The date of the scheduled take off.
                  format: date
                  example: '2023-06-19T00:00:00.0000000'
                departure_time:
                  type: string
                  description: The time of the scheduled take off.
                  example: '15:30'
                arrival_airport:
                  type: string
                  description: The IATA 3-letter airport code of the destination airport. This field is required if the airline data includes leg details.
                  example: LAX
                stop_over_code:
                  type: string
                  description: A one-letter code that indicates whether the passenger is entitled to make a stopover. Can be a space, O if the passenger is entitled to make a stopover, or X if they are not.
                  example: x
                fare_basis_code:
                  type: string
                  description: The fare basis code, alphanumeric.
                  example: SPRSVR
            description: Contains information about the flight leg(s) booked by the customer.
      description: Contains information about the airline ticket and flights booked by the customer.
    CardPayoutRequest:
      title: Card Payout
      required:
      - source
      - destination
      - currency
      - instruction
      - processing_channel_id
      type: object
      properties:
        source:
          required:
          - type
          - id
          type: object
          properties:
            type:
              enum:
              - currency_account
              type: string
              description: The payout source type.
            id:
              maxLength: 29
              minLength: 29
              pattern: ^(ca)_(\w{26})$
              type: string
              description: The ID of the currency account that will fund the payout.
          description: The source of the payout.
        destination:
          $ref: '#/components/schemas/CardPayoutRequestDestination'
        amount:
          minimum: 0
          type: integer
          description: 'The amount to pay out, in minor units. Use the [specific format](https://www.checkout.com/docs/payments/accept-payments/calculating-the-amount) for the `currency` you specify for the payout.

            '
        currency:
          type: string
          description: 'The [three-letter ISO 4217 code](https://www.checkout.com/docs/developer-resources/codes/currency-codes) for the currency you want to pay out to the recipient.

            '
        instruction:
          required:
          - funds_transfer_type
          type: object
          properties:
            funds_transfer_type:
              type: string
              description: "The [funds transfer type](https://www.checkout.com/docs/payments/request-payouts/card-payouts#Fund_Transfer_Types) code for the type of payout you're performing. \n\nYou can only use codes that have been assigned to you by the card schemes and Checkout.com, based on your business case and requirements. \n\nIf you have only been assigned one funds transfer type code, this field is optional.\n"
            purpose:
              enum:
              - family_support
              - expatriation
              - travel_and_tourism
              - education
              - medical_treatment
              - emergency_need
              - leisure
              - savings
              - gifts
              - donations
              - financial_services
              - it_services
              - investment
              - insurance
              - loan_payment
              - pension
              - royalties
              - other
              - income
              type: string
              description: "The purpose of the payout.\n\nThis field is required if the card's `issuer_country` is one of:\n\n  - `AR` (Argentina)\n  - `BD` (Bangladesh)\n  - `CL` (Chile)\n  - `CO` (Colombia)\n  - `EG` (Egypt)\n  - `IN` (India)\n  - `MX` (Mexico)\n  - `SA` (Saudi Arabia)\n\nTo view a card's `issuer_country`, [retrieve the card's metadata](https://api-reference.checkout.com/#operation/requestCardMetadata!c=200&path=issuer_country&t=response).\n"
          description: Additional details about the payout instruction.
        items:
          $ref: '#/components/schemas/CardPayoutItems'
        processing_channel_id:
          maxLength: 29
          minLength: 29
          pattern: ^(pc)_(\w{26})$
          type: string
          description: The unique identifier for the processing channel.
        sender:
          $ref: '#/components/schemas/CardPayoutRequestSender'
        reference:
          maxLength: 50
          type: string
          description: A custom reference to identify the payout. For example, an order number.
        previous_payment_id:
          type: string
          description: 'The identifier of an existing payment from the recurring series, if the payout is a recurring payment that uses <a href="https://www.checkout.com/docs/previous/payments/accept-payments/pay-with-stored-details" target="blank">stored card details</a>.


            If the card payout is linked to a previous <a href="https://www.checkout.com/docs/payments/manage-payments/perform-an-account-funding-transaction" target="_blank">Account Funding Transaction (AFT)</a>, you must include this field in your request with one of the following values:


            - If the previous AFT was processed by Checkout.com, use the previous payment''s ID.

            - If the previous AFT was processed by another payment service provider (PSP), use the scheme''s transaction ID.

            '
          example: pay_fun26akvvjjerahhctaq2uzhu4
        metadata:
          type: object
          description: "Stores additional information about the transaction with custom fields.\n\nYou can also provide up to five user-defined fields (`udf1` to `udf5`), for your reporting purposes. `udf1` is also used for some of our risk rules. \n\nYou can only supply primitive data types with one level of depth. Fields of type `object` or `array` are not supported.\n"
        segment:
          $ref: '#/components/schemas/Segment'
        processing:
          type: object
          properties:
            affiliate_id:
              maxLength: 15
              pattern: ^[a-zA-Z0-9]{1,15}$
              type: string
              description: 'The unique identifier for Visa-registered ramp providers.


                Must only contain alphanumeric characters.


                If you''re a Visa-registered ramp provider operating with affiliates, this field is required.

                '
            affiliate_url:
              type: string
              description: 'The affiliate URL.


                If you''re a Visa-registered ramp provider operating with affiliates, this field is required.

                '
              example: www.mycrypto.com
            processing_speed:
              enum:
              - fast
              type: string
              description: "The speed at which the payout is processed. \n\nOnly applicable for <a href=\"https://www.checkout.com/docs/payments/manage-payments/refund-a-payment/refund-a-payment-without-a-reference\">unreferenced refunds</a>.\n"
            purchase_country:
              maxLength: 2
              type: string
              description: 'The two-letter <a href="https://www.checkout.com/docs/previous/resources/codes/country-codes" target="_blank">ISO country code</a> of the purchase country.


                If you''re a Visa-registered ramp provider operating with affiliates, this field is required.

                '
              example: GB
          description: Returns information related to the processing of the payment.
    PaymentRequestAlipayHkSource:
      title: alipay_hk
      required:
      - type
      type: object
      properties:
        type:
          type: string
          allOf:
          - $ref: '#/components/schemas/PaymentRequestSourceType'
          - enum:
            - alipay_hk
            type: string
          description: The payment source type.
          example: alipay_hk
      description: Alipay HK Source
    PaymentContextPaymentRequest:
      title: Payment Context
      required:
      - payment_context_id
      type: object
      properties:
        payment_context_id:
          type: string
          allOf:
          - $ref: '#/components/schemas/PaymentContextId'
