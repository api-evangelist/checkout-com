          description: The unique identifier for the void action
        reference:
          type: string
          description: Your reference for the void request
          example: ORD-5023-4E89
        _links:
          minItems: 2
          required:
          - payment
          type: object
          properties:
            payment:
              type: object
              allOf:
              - $ref: '#/components/schemas/Link'
              example:
                href: https://{prefix}.api.checkout.com/payments/pay_y3oqhf46pyzuxjbcn2giaqnb44
          description: The links related to the void
          readOnly: true
      description: Void response
    PaymentRequestBancontactSource:
      title: bancontact
      required:
      - type
      - payment_country
      - account_holder_name
      type: object
      properties:
        payment_country:
          maxLength: 2
          minLength: 2
          enum:
          - BE
          type: string
          description: The 2-letter ISO country code of the country in which the payment instrument is issued/operated.
        account_holder_name:
          maxLength: 100
          minLength: 3
          type: string
          description: The account holder.
        billing_descriptor:
          maxLength: 65534
          type: string
          description: Payment billing descriptor.
        language:
          maxLength: 2
          minLength: 2
          enum:
          - fr
          - nl
          - de
          - en
          type: string
          description: The 2-letter ISO language code that should be preferred when presenting payment pages to the consumer.
          default: fr
          example: nl
        type:
          type: string
          allOf:
          - $ref: '#/components/schemas/PaymentRequestSourceType'
          - enum:
            - bancontact
            type: string
          description: The payment source type.
          example: bancontact
      description: Bancontact Source
    PaymentGetResponseSwishSource:
      title: swish
      required:
      - type
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/PaymentDetailsResponseSourceType'
          - enum:
