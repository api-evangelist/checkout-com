      title: Integrated authentication
      required:
      - enabled
      type: object
      oneOf:
      - $ref: '#/components/schemas/3dsRequestNonEnabled'
      - $ref: '#/components/schemas/3dsRequestEnabled'
      properties:
        enabled:
          enum:
          - 'true'
          - 'false'
          type: string
          description: Whether to process this payment as a 3D Secure payment. Payments where `merchant_initiated` is `true` will be processed as <a href="https://www.checkout.com/docs/payments/authenticate-payments/3d-secure/request-3ri-authentication" target="_blank">3DS Requestor Initiated.</a>
          example: 'true'
        challenge_indicator:
          enum:
          - no_preference
          - no_challenge_requested
          - challenge_requested
          - challenge_requested_mandate
          type: string
          description: Indicates the preference for whether or not a 3DS challenge should be performed. The customer’s bank has the final say on whether or not the customer receives the challenge.
          default: no_preference
      description: Required information to process a 3DS authentication with the payment request
      discriminator:
        propertyName: enabled
        mapping:
          'false': '#/components/schemas/3dsRequestNonEnabled'
          'true': '#/components/schemas/3dsRequestEnabled'
    ResponseCode:
      enum:
      - Y
      - N
      - U
      - A
      - C
      - D
      - R
      - I
      type: string
      description: "Only available as a result of a 3DS2 authentication. \nThe response from the DS or ACS which indicates whether a transaction qualifies as an authenticated transaction or account verification. <br/> Only available if communication with the scheme was successful and the Session is in a final state. <br/><br/> • Y = Authentication Verification Successful. <br/> • N = Not Authenticated /Account Not Verified; Transaction denied. <br/> • U = Authentication/ Account Verification Could Not Be Performed; Technical or other problem, as indicated in ARes or RReq. <br/> • A = Attempts Processing Performed; Not Authenticated/Verified, but a proof of attempted authentication/verification is provided. <br/> • C = Challenge Required; Additional authentication is required using the CReq/CRes. <br/> • D = Challenge Required; Decoupled Authentication confirmed. <br/> • R = Authentication/ Account Verification Rejected; Issuer is rejecting authentication/verification and request that authorization not be attempted. <br/> • I = Informational Only; 3DS Requestor challenge preference acknowledged.\n"
