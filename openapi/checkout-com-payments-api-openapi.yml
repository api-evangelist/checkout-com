              type: string
              description: The payment type display name.
              example: Visa 1234
            type:
              type: string
              description: The payment method type.
              example: debit
            network:
              type: string
              description: The card network.
              example: Visa
          description: The payment data received in the Apple Pay payload. Required for Apple Pay payments.
      description: KNet Source
