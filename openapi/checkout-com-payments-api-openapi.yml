        company_name:
          maxLength: 50
          type: string
          description: "The corporate account holder's company name.\n\nThis must be a valid legal name. The following formats for the `company_name` value will return a [field validation error](https://www.checkout.com/docs/developer-resources/codes/error-codes#Field_validation_errors):\n\n  - a single character\n  - all non-alphabetic characters\n"
        billing_address:
          type: object
          properties:
            address_line1:
              maxLength: 200
              type: string
              description: 'The first line of the address.

                '
            address_line2:
              maxLength: 200
              type: string
              description: The second line of the address.
            city:
              maxLength: 50
              type: string
              description: The address city.
            state:
              maxLength: 3
              minLength: 2
              type: string
              description: 'The address state.

                '
            zip:
              maxLength: 10
              type: string
              description: 'The address ZIP or postal code.


                You must provide US ZIPs in the format `00000`, or `00000-0000`.

                '
            country:
              maxLength: 2
              minLength: 2
              type: string
              description: 'The address country, as a [two-letter ISO country code](https://www.checkout.com/docs/developer-resources/codes/country-codes).

                '
          description: 'The account holder''s billing address.


            If your company is incorporated in the United States, this field is required for all unreferenced refunds you perform.

            '
        phone:
          required:
          - country_code
          - number
          type: object
          properties:
            country_code:
              maxLength: 7
              minLength: 1
              type: string
              description: The international dialing code for the account holder's address `country`, as an [ITU-T E.164 code](https://www.checkout.com/docs/developer-resources/codes/country-codes).
            number:
              maxLength: 25
              minLength: 6
              type: string
              description: The digits of the phone number, not including the `country_code`.
          description: The account holder's phone number.
        identification:
          required:
          - type
          - number
          type: object
          properties:
            type:
              enum:
              - passport
              - driving_license
              - national_id
              - company_registration
              - tax_id
              type: string
              description: The type of identification for the account holder.
            number:
              maxLength: 25
              type: string
              description: The account holder's identification number.
            issuing_country:
              maxLength: 2
              minLength: 2
              type: string
              description: 'If applicable, the country that issued the account holder''s identification, as a [two-letter ISO country code](https://www.checkout.com/docs/developer-resources/codes/country-codes).


                Providing `issuing_country` increases the likelihood of a successful identity verification.

                '
            date_of_expiry:
              maxLength: 10
              minLength: 10
              type: string
              description: 'If applicable, the expiration date of the account holder''s identification, in the format `YYYY-MM-DD`.


                Providing `date_of_expiry` increases the likelihood of a successful identity verification.

                '
          description: 'The account holder''s identification.


            Providing identification details for the unreferenced refund recipient increases the likelihood of a successful unreferenced refund.

            '
        email:
          maxLength: 255
          type: string
          description: The account holder's email address.
      description: The unreferenced refund destination account holder's details.
    CustomerSummary:
      type: object
      properties:
        registration_date:
          type: string
          description: The date the customer registered.
          format: date
          example: '2023-05-01T00:00:00.0000000'
        first_transaction_date:
          type: string
          description: The date of the customer's first transaction.
          format: date
          example: '2023-07-01T00:00:00.0000000'
        last_payment_date:
          type: string
          description: The date of the customer's last payment.
          format: date
          example: '2023-08-01T00:00:00.0000000'
        total_order_count:
          type: integer
          description: The total number of orders made by the customer.
          example: 15
        last_payment_amount:
          type: number
          description: The amount of the customer's last payment.
          format: float
          example: 500
        is_premium_customer:
          type: boolean
          description: Specifies whether the customer is a premium customer.
          example: true
        is_returning_customer:
          type: boolean
          description: Specifies whether the customer is a returning customer.
          example: true
        lifetime_value:
          type: number
          description: "The customer's lifetime value. This is the total monetary amount that the customer has ordered, in their local currency, excluding the following:\n   \n- canceled orders\n- rejected payments\n- refunded payments\n- Tamara payments\n\nThe lifetime value is an indicator of how valuable the relationship with the customer is to your company. \n"
          format: float
          example: 500
      description: Summary of the customer's transaction history. <br> Used for risk assessment when `source.type` is `Tamara`
    PaymentContextPaymentResponse:
      title: PaymentContextResponse
