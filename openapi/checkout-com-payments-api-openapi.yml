            '
        amount:
          minimum: 0
          type: integer
          description: 'The payment amount.

            The amount must be provided in the <a href="https://www.checkout.com/docs/resources/calculating-the-amount" target="blank">minor currency unit</a>.

            '
          example: 6540
        reference:
          maxLength: 80
          type: string
          description: 'A reference you can later use to identify this payment, such as an order number.<br>Can only be alphanumeric and must be unique for Benefit.<br>For Amex, the string limit is 30 characters.

            '
