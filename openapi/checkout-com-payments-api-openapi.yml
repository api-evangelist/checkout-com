            purpose:
              enum:
              - family_support
              - expatriation
              - travel_and_tourism
              - education
              - medical_treatment
              - emergency_need
              - leisure
              - savings
              - gifts
              - donations
              - financial_services
              - it_services
              - investment
              - insurance
              - loan_payment
              - pension
              - royalties
              - other
              - income
              type: string
              description: "The purpose of the unreferenced refund.\n\nThis field is required if the card's `issuer_country` is one of:\n\n  - `AR` (Argentina)\n  - `BD` (Bangladesh)\n  - `CL` (Chile)\n  - `CO` (Colombia)\n  - `EG` (Egypt)\n  - `IN` (India)\n  - `MX` (Mexico)\n\nTo view a card's `issuer_country`, [retrieve the card's metadata](https://api-reference.checkout.com/#operation/requestCardMetadata!c=200&path=issuer_country&t=response).\n"
          description: Additional details about the unreferenced refund instruction.
