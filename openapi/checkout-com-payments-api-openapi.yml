            '
        user_defined_field1:
          maxLength: 255
          type: string
          description: User-defined field that can be used to pass and store any additional transaction data required to be archived with the transaction and available as a searching criterion. Only alphanumeric characters and spaces are allowed
        user_defined_field2:
          maxLength: 255
          type: string
          description: User-defined field that can be used to pass and store any additional transaction data required to be archived with the transaction and available as a searching criterion. Only alphanumeric characters and spaces are allowed
        user_defined_field3:
          maxLength: 255
          type: string
          description: User-defined field that can be used to pass and store any additional transaction data required to be archived with the transaction and available as a searching criterion. Only alphanumeric characters and spaces are allowed. Note that this field must be omitted when the `card_token` field is not empty. This restriction exists because a card token is passed to KNet Gateway as `user_defined_field3`
        user_defined_field4:
          maxLength: 255
          type: string
          description: User-defined field that can be used to pass and store any additional transaction data required to be archived with the transaction and available as a searching criterion. Only alphanumeric characters and spaces are allowed.
        user_defined_field5:
          maxLength: 255
          type: string
          description: User-defined field that can be used to pass and store any additional transaction data required to be archived with the transaction and available as a searching criterion. Only alphanumeric characters and spaces are allowed. Note that this field must be omitted when the `ptlf` field is not empty. This restriction exists because a PTLF value is passed to KNet Gateway as `user_defined_field5`
        card_token:
          pattern: ^[0-9]{8}$
          type: string
          description: This token allows re-use of card details for multiple payments. This 8-digit token should be generated by a merchant. When a subsequent payment is initialized with the same card token, a customer is presented with two options. The customer can choose to pay with KFast (doesn't need to enter card details again), or with KNet as usual. The payment flow stays the same i.e. a merchant should redirect a customer to the redirect URL which is provided in the payment creation response. Note that `user_defined_field3` must be omitted when the `card_token` field is not empty. This restriction exists because a card token is passed to KNet Gateway as `user_defined_field3`
        ptlf:
          maxLength: 45
          type: string
          description: This is an ID for merchant PTLF functionality tracking. Only alphanumeric characters are allowed. Note that `user_defined_field5` must be omitted when the `ptlf` field is not empty. This restriction exists because a PTLF value is passed to KNet Gateway as `user_defined_field5`.
        token_type:
          enum:
          - applepay
          type: string
          description: The token type. This field is always `applepay` for KNet Apple Pay payments.
        token_data:
          allOf:
          - $ref: '#/components/schemas/TokenData'
          description: The Apple Pay payment token. Required for Apple Pay payments.
        payment_method_details:
          type: object
          properties:
