      description: The destination of the payout.
      discriminator:
        propertyName: type
        mapping:
          id: '#/components/schemas/PaymentRequestIdDestination'
          bank_account: '#/components/schemas/PaymentBankAccountDestination'
    CaptureRequestProcessingSettings:
      type: object
      properties:
        order_id:
          maxLength: 17
