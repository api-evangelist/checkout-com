        description:
          maxLength: 100
          type: string
          description: A description of the payment.
          example: Set of 3 masks
        processing_channel_id:
          pattern: ^(pc)_(\w{26})$
          type: string
          description: 'The processing channel to be used for the payment context. Required if this was not set in the request for the OAuth token.

            '
        processing:
          type: object
          properties:
            invoice_id:
              maxLength: 127
              type: string
              description: The identification number of the invoice.
            shipping_amount:
              minimum: 0
              type: number
              description: The total freight or shipping and handling charges for the transaction.
              example: 300
            discount_amount:
              minimum: 0
              type: number
              description: The discount amount.
              example: 5
            tax_amount:
              minimum: 0
              type: number
              description: The total tax amount for the transaction, in [minor currency units](https://www.checkout.com/docs/payments/accept-payments/calculating-the-amount).
              example: 3000
            otp_value:
              maxLength: 50
              type: string
              description: One time password sent to customer by SMS. <br> Required if `source.type` is `StcPay`.
              example: '966557877988'
            airline_data:
              $ref: '#/components/schemas/AirlineData'
            accommodation_data:
              $ref: '#/components/schemas/AccommodationData'
          description: Use the processing object to influence or override the data during the payment processing.
        shipping:
          $ref: '#/components/schemas/Shipping'
        segment:
          $ref: '#/components/schemas/Segment'
    PaymentRequestCardSource:
      title: card
      required:
      - type
      - number
      - expiry_month
      - expiry_year
      type: object
      properties:
        number:
          type: string
          description: The card number (without separators)
          example: '4543474002249996'
        expiry_month:
          maximum: 12
          minimum: 1
          type: integer
          description: The expiry month of the card
          example: 6
        expiry_year:
          type: integer
          description: 4-digit expiry year of the card
          example: 2030
        name:
          type: string
          description: The name of the cardholder
          example: Bruce Wayne
        cvv:
          maxLength: 4
          minLength: 3
          type: string
          description: The card verification value/code. 3 digits, except for American Express (4 digits)
          example: '956'
        stored:
          type: boolean
          description: Indicates whether this card is being submitted from your own stored card-on-file system, rather than being entered by the customer at the time of payment. Set to `true` when you provide card details that you already have on file for the customer.
          default: false
          example: true
        store_for_future_use:
          type: boolean
          description: This must be set to true if you intend to reuse the payment credentials in subsequent payments. Setting the field as false will mean that a <a href="https://www.checkout.com/docs/payments/store-payment-details/payment-instruments" target="blank">payment instrument</a> will not be included in the payment response.
          default: true
          example: false
        billing_address:
          allOf:
          - $ref: '#/components/schemas/Address'
          description: The billing address of the cardholder
        phone:
          allOf:
          - $ref: '#/components/schemas/PhoneNumber'
          description: The phone number of the cardholder
        account_holder:
          required:
          - type
          type: object
          description: Information about the account holder of the card
          discriminator:
            propertyName: type
            mapping:
              individual: '#/components/schemas/01_RequestSources_AccountHolderIndividual'
              corporate: '#/components/schemas/02_RequestSources_AccountHolderCorporate'
              government: '#/components/schemas/03_RequestSources_AccountHolderGovernment'
        allow_update:
          type: boolean
          description: Specifies whether to use the <a href="https://checkout.com/docs/payments/store-and-manage-credentials/update-stored-credentials/real-time-account-updater">Real-Time Account Updater</a> to update the card information.
          default: true
          example: false
        type:
          type: string
          allOf:
          - $ref: '#/components/schemas/PaymentRequestSourceType'
          - enum:
            - card
            type: string
          description: The payment source type.
          example: card
      description: A card payment source
    PaymentReversalAcceptedResponse:
      required:
      - action_id
      type: object
      properties:
        action_id:
          allOf:
          - $ref: '#/components/schemas/ActionId'
          description: The unique identifier for the payment reversal action.
        reference:
          type: string
          description: A unique reference for the payment reversal.
          example: ORD-5023-4E89
        action_type:
          type: string
          description: "The payment action performed during the reversal. \nDetermined by the payment's state at the time of processing:\n - `Refund` if the payment has been fully or partially captured\n - `Void` if the payment is in an `Authorized` state.\n"
          example: Refund
