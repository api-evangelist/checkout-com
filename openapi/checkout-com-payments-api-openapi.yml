          properties:
            payment:
              allOf:
              - $ref: '#/components/schemas/Link'
              - example:
                  href: https://{prefix}.api.checkout.com/payments/pay_y3oqhf46pyzuxjbcn2giaqnb44
              description: "The URI of the payment to be reversed. \n\nYou can use this value to check the status of the payment reversal.\n"
          description: Links related to the payment reversal.
          readOnly: true
      description: Reversal response
    CardPayoutDetails:
      required:
