openapi: 3.2.0
info:
  title: Checkout.com API Reference Standalone API
  description: '## Get started

    Checkout.com provides a collection of APIs that enable you to integrate with our various products and services.

    Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using any HTTP or REST library.

    Sign up for a test account to gain access to the sandbox environment, where you can test API calls without affecting live data.

    For more information, see:


    - API endpoints

    - API rate limits

    - API changes

    - Idempotency

    - Private connections


    ## Base URLs

    The base URLs you must use for your API calls to the sandbox and production environments are unique to you.


    - `https://{prefix}.api.sandbox.checkout.com/{path}`

    - `https://{prefix}.api.checkout.com/{path}`

    - `https://{prefix}.access.sandbox.checkout.com/{path}`

    - `https://{prefix}.access.checkout.com/{path}`


    The unique API endpoint host names resolve to Checkout.com''s IP addresses. Do not allowlist these IP addresses.

    The `{prefix}` value in each base URL is a string containing the first eight characters of each of your environments'' unique `client_id`, excluding the `cli_` prefix.

    To find your unique base URL:

    1. Sign in to the Dashboard environment you want to retrieve the base URL for:


    - Sandbox

    - Production


    2. Go to _Developers_ > _Overview_.

    Your unique base URL is displayed on the _Developer overview_ page. For example, `https://vkuhvk4v.api.checkout.com`.


    3. Alternatively, go to _Settings_ > _Account details_.

    Your unique base URL is displayed under _Connection settings_.


    If you are unsure of your client ID or base URL for either environment, contact your account manager or request support.

    For more information, see API endpoints.

    ## Authentication

    When you sign up for an account, you can authenticate with either Access keys (OAuth 2.0), or Secret API keys.

    Unless explicitly stated, all endpoints require authentication using either your Access or Secret API Keys. Public keys should only be used in JavaScript or native applications.


    - **Client-side authentication**. Use your public key for client-side authentication. It only has access to a limited set of our APIs – mostly those called as part of your payment environment.


    - **Server-to-server authentication**. Use your secret key or OAuth for server-to-server communication. Support for API keys depends on the endpoint.


    Never share your OAuth credentials, API keys, or access tokens. Keep them guarded and secure.'
  termsOfService: https://www.checkout.com/legal/terms-and-policies
  contact:
    name: Checkout.com Support
    url: https://dashboard.checkout.com/support
  version: v1.0.0
servers:
- url: https://{prefix}.api.sandbox.checkout.com
  description: Sandbox environment
  variables:
    prefix:
      default: '{prefix}'
      description: Your unique <a href="https://www.checkout.com/docs/developer-resources/api/api-endpoints" target="_blank">base URL</a>. There is no default value.
- url: https://{prefix}.api.checkout.com
  description: Production environment
  variables:
    prefix:
      default: '{prefix}'
      description: Your unique <a href="https://www.checkout.com/docs/developer-resources/api/api-endpoints" target="_blank">base URL</a>. There is no default value.
tags:
- name: Standalone
  description: Use Standalone Sessions to authenticate transactions with 3D Secure (3DS) and comply with Strong Customer Authentication (SCA) requirements.
paths:
  /sessions:
    post:
      tags:
      - Standalone
      summary: Request a session
      description: 'Create a payment session to authenticate a cardholder before requesting a payment.

        Payment sessions can be linked to one or more payments (in the case of recurring and other merchant-initiated payments).


        The `next_actions` object in the response tells you which actions can be performed next.'
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '201':
          description: Session processed successfully
          headers:
            Cko-Request-Id:
              $ref: '#/components/headers/Cko-Request-Id'
            Cko-Version:
              $ref: '#/components/headers/Cko-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionOkResponse'
        '202':
          description: Session accepted and further action required
          headers:
            Cko-Request-Id:
              $ref: '#/components/headers/Cko-Request-Id'
            Cko-Version:
              $ref: '#/components/headers/Cko-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionAcceptedResponse'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden. Ensure scope matches `"channel_data.channel"`: Use `sessions:app` for `"app"` and `sessions:browser` for `"browser"`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid data was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service not available. A temporary server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth:
        - sessions:app
        - sessions:browser
      x-code-samples:
      - lang: Go
        source: "// For more information please refer to https://github.com/checkout/checkout-sdk-go\nimport (\n\t\"github.com/checkout/checkout-sdk-go\"\n\t\"github.com/checkout/checkout-sdk-go/common\"\n\t\"github.com/checkout/checkout-sdk-go/configuration\"\n\t\"github.com/checkout/checkout-sdk-go/sessions\"\n\t\"github.com/checkout/checkout-sdk-go/sessions/completion\"\n\t\"github.com/checkout/checkout-sdk-go/sessions/sources\"\n)\n\n// API Keys\napi, err := checkout.\n\t\t\tBuilder().\n\t\t\tStaticKeys().\n\t\t\tWithSecretKey(\"secret_key\").\n\t\t\tWithEnvironment(configuration.Sandbox()). // or Environment.PRODUCTION\n                        WithEnvironmentSubdomain(\"{prefix}\"). // Your base URL's {prefix} value is unique to your account and environment. To learn how to retrieve your base URLs for the sandbox and production environments, see https://www.checkout.com/docs/developer-resources/api/api-endpoints.\n\t\t\tBuild()\nif err != nil {\n\treturn nil, err\n}\n\n// OAuth\napi, err := checkout.\n\t\t\tBuilder().\n\t\t\tOAuth().\n\t\t\tWithClientCredentials(\"client_id\", \"client_secret\").\n\t\t\tWithScopes([]string{configuration.SessionsApp, configuration.SessionsBrowser}).\n\t\t\tWithEnvironment(configuration.Sandbox()). // or Environment.PRODUCTION\n                        WithEnvironmentSubdomain(\"{prefix}\"). // Your base URL's {prefix} value is unique to your account and environment. To learn how to retrieve your base URLs for the sandbox and production environments, see https://www.checkout.com/docs/developer-resources/api/api-endpoints.\n\t\t\tBuild()\nif err != nil {\n\treturn nil, err\n}\n\nsource := sources.NewSessionCardSource()\nsource.Number = \"12345678\"\nsource.ExpiryMonth = 10\nsource.ExpiryYear = 2027\n\ncompletion := completion.NewHostedCompletion()\ncompletion.SuccessUrl = \"https://docs.checkout.com/sessions/success\"\ncompletion.FailureUrl = \"https://docs.checkout.com/sessions/fail\"\n\nrequest := sessions.SessionRequest{\n\tSource:                 source,\n\tAmount:                 10,\n\tCurrency:               common.GBP,\n\tProcessingChannelId:    \"processing_channel_id\",\n\tAuthenticationType:     sessions.RegularAuthType,\n\tAuthenticationCategory: sessions.Payment,\n\tChallengeIndicator:     common.NoPreference,\n\tReference:              \"reference\",\n\tTransactionType:        sessions.GoodsService,\n\tShippingAddress: &sources.SessionAddress{\n\t\tAddress: common.Address{\n\t\t\tAddressLine1: \"123 High St.\",\n\t\t\tAddressLine2: \"Flat 456\",\n\t\t\tCity:         \"London\",\n\t\t\tState:        \"GB\",\n\t\t\tZip:          \"SW1A 1AA\",\n\t\t\tCountry:      common.GB,\n\t\t},\n\t},\n\tCompletion:  completion,\n}\n\nresponse, err := api.Sessions.RequestSession(request)\nif err != nil {\n\treturn nil, err\n}\n\nreturn response, nil"
  /sessions/{id}:
    get:
      tags:
      - Standalone
      summary: Get session details
      description: Returns the details of the session with the specified identifier string.
      operationId: getSession
      parameters:
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
      - name: channel
        in: header
        description: Optionally provide the type of channnel so you only get the relevant actions
        schema:
          enum:
          - browser
          - app
          type: string
          description: If a value is not provided, and if the `status` is `pending`, then `next_actions` will return `collect_channel_data` and if available, `issuer_fingerprint`.
          example: browser
      responses:
        '200':
          description: Session retrieved successfully
          headers:
            Cko-Request-Id:
              $ref: '#/components/headers/Cko-Request-Id'
            Cko-Version:
              $ref: '#/components/headers/Cko-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSessionResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden. This can happen when the OAuth token scope is `sessions:app`, but the session was initiated with the scope `sessions:browser`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad gateway
      security:
      - OAuth:
        - sessions:app
        - sessions:browser
      - SessionSecret: []
      x-code-samples:
      - lang: Go
        source: "// For more information please refer to https://github.com/checkout/checkout-sdk-go\nimport (\n\t\"github.com/checkout/checkout-sdk-go\"\n\t\"github.com/checkout/checkout-sdk-go/configuration\"\n)\n\n// API Keys\napi, err := checkout.\n\t\t\tBuilder().\n\t\t\tStaticKeys().\n\t\t\tWithSecretKey(\"secret_key\").\n\t\t\tWithEnvironment(configuration.Sandbox()). // or Environment.PRODUCTION\n                        WithEnvironmentSubdomain(\"{prefix}\"). // Your base URL's {prefix} value is unique to your account and environment. To learn how to retrieve your base URLs for the sandbox and production environments, see https://www.checkout.com/docs/developer-resources/api/api-endpoints.\n\t\t\tBuild()\nif err != nil {\n\treturn nil, err\n}\n\n// OAuth\napi, err := checkout.\n\t\t\tBuilder().\n\t\t\tOAuth().\n\t\t\tWithClientCredentials(\"client_id\", \"client_secret\").\n\t\t\tWithScopes([]string{configuration.SessionsApp, configuration.SessionsBrowser}).\n\t\t\tWithEnvironment(configuration.Sandbox()). // or Environment.PRODUCTION\n                        WithEnvironmentSubdomain(\"{prefix}\"). // Your base URL's {prefix} value is unique to your account and environment. To learn how to retrieve your base URLs for the sandbox and production environments, see https://www.checkout.com/docs/developer-resources/api/api-endpoints.\n\t\t\tBuild()\nif err != nil {\n\treturn nil, err\n}\n\nresponse, err := api.Sessions.GetSessionDetails(\"session_id\", \"session_secret\") // \"session_secret\" is optional\nif err != nil {\n\treturn nil, err\n}\n\nreturn response, nil"
  /sessions/{id}/collect-data:
    put:
      tags:
      - Standalone
      summary: Update a session
      description: Update a session by providing information about the environment.
      operationId: updateSession
      parameters:
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelData'
        required: true
      responses:
        '200':
          description: Session updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSessionResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable channel information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth:
        - sessions:app
        - sessions:browser
      - SessionSecret: []
      x-code-samples:
      - lang: Go
        source: "// For more information please refer to https://github.com/checkout/checkout-sdk-go\nimport (\n\t\"github.com/checkout/checkout-sdk-go\"\n\t\"github.com/checkout/checkout-sdk-go/common\"\n\t\"github.com/checkout/checkout-sdk-go/configuration\"\n\t\"github.com/checkout/checkout-sdk-go/sessions/channels\"\n)\n\n// API Keys\napi, err := checkout.\n\t\t\tBuilder().\n\t\t\tStaticKeys().\n\t\t\tWithSecretKey(\"secret_key\").\n\t\t\tWithEnvironment(configuration.Sandbox()). // or Environment.PRODUCTION\n                        WithEnvironmentSubdomain(\"{prefix}\"). // Your base URL's {prefix} value is unique to your account and environment. To learn how to retrieve your base URLs for the sandbox and production environments, see https://www.checkout.com/docs/developer-resources/api/api-endpoints.\n\t\t\tBuild()\nif err != nil {\n\treturn nil, err\n}\n\n// OAuth\napi, err := checkout.\n\t\t\tBuilder().\n\t\t\tOAuth().\n\t\t\tWithClientCredentials(\"client_id\", \"client_secret\").\n\t\t\tWithScopes([]string{configuration.SessionsApp, configuration.SessionsBrowser}).\n\t\t\tWithEnvironment(configuration.Sandbox()). // or Environment.PRODUCTION\n                        WithEnvironmentSubdomain(\"{prefix}\"). // Your base URL's {prefix} value is unique to your account and environment. To learn how to retrieve your base URLs for the sandbox and production environments, see https://www.checkout.com/docs/developer-resources/api/api-endpoints.\n\t\t\tBuild()\nif err != nil {\n\treturn nil, err\n}\n\nchannel := channels.NewBrowserSession()\nchannel.AcceptHeader = \"Accept:  *.*, q=0.1\"\nchannel.JavaEnabled = true\nchannel.Language = \"FR-fr\"\nchannel.ColorDepth = \"16\"\nchannel.ScreenWidth = \"1920\"\nchannel.ScreenHeight = \"1080\"\nchannel.Timezone = \"60\"\nchannel.UserAgent = \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/69.0.3497.100 Safari/537.36\"\nchannel.ThreeDsMethodCompletion = common.Y\nchannel.IpAddress = \"1.12.123.255\"\n\nresponse, err := api.Sessions.UpdateSession(\"session_id\", channel,\"session_secret\") // \"session_secret\" is optional\nif err != nil {\n\treturn nil, err\n}\n\nreturn response, nil"
  /sessions/{id}/complete:
    post:
      tags:
      - Standalone
      summary: Complete a session
      description: 'Completes a session by posting the following request to the callback URL. This step is optional and only applies to non-hosted sessions:

        ```

        {

        "session_id": "sid_llraltf4jlwu5dxdtprcv7ba5i",

        "amount" : 6540,

        "currency": "USD",

        "status": "approved",

        "authentication_type": "regular",

        "authentication_category": "payment",

        "reference": "ORD-5023-4E89",

        "approved": true,

        "protocol_version": "2.2.0",

        "response_code": "Y",

        "response_status_reason": "01",

        "cryptogram": "MTIzNDU2Nzg5MDA5ODc2NTQzMjE=",

        "eci": "05",

        "xid": "XSUErNftqkiTdlkpSk8p32GWOFA",

        "cardholder_info": "Card declined. Please contact your issuing bank.",

        "challenged": true

        }

        ```


        The fields of the above are the same as they would be in a GET session response. If the callback URL fails, we recommend that you use a GET call as a fallback.'
      operationId: completeSession
      parameters:
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Session completed successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth:
        - sessions:app
        - sessions:browser
      - SessionSecret: []
      x-code-samples:
      - lang: Go
        source: "// For more information please refer to https://github.com/checkout/checkout-sdk-go\nimport (\n\t\"github.com/checkout/checkout-sdk-go\"\n\t\"github.com/checkout/checkout-sdk-go/configuration\"\n)\n\n// API Keys\napi, err := checkout.\n\t\t\tBuilder().\n\t\t\tStaticKeys().\n\t\t\tWithSecretKey(\"secret_key\").\n\t\t\tWithEnvironment(configuration.Sandbox()). // or Environment.PRODUCTION\n                        WithEnvironmentSubdomain(\"{prefix}\"). // Your base URL's {prefix} value is unique to your account and environment. To learn how to retrieve your base URLs for the sandbox and production environments, see https://www.checkout.com/docs/developer-resources/api/api-endpoints.\n\t\t\tBuild()\nif err != nil {\n\treturn nil, err\n}\n\n// OAuth\napi, err := checkout.\n\t\t\tBuilder().\n\t\t\tOAuth().\n\t\t\tWithClientCredentials(\"client_id\", \"client_secret\").\n\t\t\tWithScopes([]string{configuration.SessionsApp, configuration.SessionsBrowser}).\n\t\t\tWithEnvironment(configuration.Sandbox()). // or Environment.PRODUCTION\n                        WithEnvironmentSubdomain(\"{prefix}\"). // Your base URL's {prefix} value is unique to your account and environment. To learn how to retrieve your base URLs for the sandbox and production environments, see https://www.checkout.com/docs/developer-resources/api/api-endpoints.\n\t\t\tBuild()\nif err != nil {\n\treturn nil, err\n}\n\nresponse, err := api.Sessions.CompleteSession(\"session_id\", \"session_secret\") // \"session_secret\" is optional\nif err != nil {\n\treturn nil, err\n}\n\nreturn response, nil"
  /sessions/{id}/issuer-fingerprint:
    put:
      tags:
      - Standalone
      summary: Update session 3DS Method completion indicator
      description: Update the session's 3DS Method completion indicator based on the result of accessing the 3DS Method URL.
      operationId: updateSessionThreeDsMethodCompletion
      parameters:
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDsMethodCompletion'
        required: true
      responses:
        '200':
          description: Session updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSessionResponseAfterChannelDataSupplied'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable channel information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth:
        - sessions:browser
      - SessionSecret: []
      x-code-samples:
      - lang: Go
        source: "// For more information please refer to https://github.com/checkout/checkout-sdk-go\nimport (\n\t\"github.com/checkout/checkout-sdk-go\"\n\t\"github.com/checkout/checkout-sdk-go/common\"\n\t\"github.com/checkout/checkout-sdk-go/configuration\"\n\t\"github.com/checkout/checkout-sdk-go/sessions\"\n)\n\n// API Keys\napi, err := checkout.\n\t\t\tBuilder().\n\t\t\tStaticKeys().\n\t\t\tWithSecretKey(\"secret_key\").\n\t\t\tWithEnvironment(configuration.Sandbox()). // or Environment.PRODUCTION\n                        WithEnvironmentSubdomain(\"{prefix}\"). // Your base URL's {prefix} value is unique to your account and environment. To learn how to retrieve your base URLs for the sandbox and production environments, see https://www.checkout.com/docs/developer-resources/api/api-endpoints.\n\t\t\tBuild()\nif err != nil {\n\treturn nil, err\n}\n\n// OAuth\napi, err := checkout.\n\t\t\tBuilder().\n\t\t\tOAuth().\n\t\t\tWithClientCredentials(\"client_id\", \"client_secret\").\n\t\t\tWithScopes([]string{configuration.SessionsApp, configuration.SessionsBrowser}).\n\t\t\tWithEnvironment(configuration.Sandbox()). // or Environment.PRODUCTION\n                        WithEnvironmentSubdomain(\"{prefix}\"). // Your base URL's {prefix} value is unique to your account and environment. To learn how to retrieve your base URLs for the sandbox and production environments, see https://www.checkout.com/docs/developer-resources/api/api-endpoints.\n\t\t\tBuild()\nif err != nil {\n\treturn nil, err\n}\n\nrequest := sessions.ThreeDsMethodCompletionRequest{ThreeDsMethodCompletion: common.Y}\n\nresponse, err := api.Sessions.Update3dsMethodCompletion(\"session_id\", request, \"session_secret\") // \"session_secret\" is optional\nif err != nil {\n\treturn nil, err\n}\n\nreturn response, nil"
components:
  schemas:
    ThreeDsRequestorAuthenticationInfo:
      type: object
      properties:
        three_ds_req_auth_method:
          enum:
          - no_threeds_requestor_authentication_occurred
          - three3ds_requestor_own_credentials
          - federated_id
          - issuer_credentials
          - third_party_authentication
          - fido_authenticator
          - fido_authenticator_fido_assurance_data_signed
          - src_assurance_data
          type: string
          description: The mechanism used by the cardholder to authenticate with the 3DS Requestor.
        three_ds_req_auth_timestamp:
          type: string
          description: The UTC date and time the cardholder authenticated with the 3DS Requestor, in ISO 8601 format.
          format: date-time
        three_ds_req_auth_data:
          maxLength: 20000
          type: string
          description: Data that documents and supports a specific authentication process.
      description: Information about how the 3DS Requestor authenticated the cardholder before or during the transaction.
    Eci:
      maxLength: 2
      minLength: 2
      type: string
      description: 'Electronic Commerce Indicator.  Please be advised that this field will only be included in responses when authenticating with a valid OAuth token and not when authenticating with `session_secret`.

        '
      example: '05'
    GetSessionResponse:
      required:
      - id
      - transaction_id
      - scheme
      - amount
      - currency
      - authentication_type
      - authentication_category
      - status
      - protocol_version
      - _links
      - challenge_indicator
      properties:
        id:
          $ref: '#/components/schemas/SessionId'
        session_secret:
          $ref: '#/components/schemas/SessionSecret'
        transaction_id:
          maxLength: 36
          minLength: 36
          type: string
          description: The transaction identifier that needs to be provided when communicating directly with the Access Control Server (ACS)
          example: 9aea641d-0549-4222-9ca9-d90b43a4f38c
        scheme:
          enum:
          - visa
          - mastercard
          - jcb
          - amex
          - diners
          - cartes_bancaires
          - discover
          - upi
          type: string
          description: Indicates the scheme this authentication is carried out against
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        completed:
          type: boolean
          description: Indicates whether this session has been completed
          example: false
        challenged:
          type: boolean
          description: Indicates whether this session involved a challenge. This will only be set after communication with the scheme is finished.
          example: true
        authentication_type:
          $ref: '#/components/schemas/AuthenticationType'
        authentication_category:
          $ref: '#/components/schemas/Category'
        certificates:
          $ref: '#/components/schemas/DsPublicKeys'
        status:
          $ref: '#/components/schemas/Status'
        status_reason:
          $ref: '#/components/schemas/StatusReason'
        approved:
          $ref: '#/components/schemas/Approved'
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        account_info:
          $ref: '#/components/schemas/CardholderAccountInfo'
        merchant_risk_info:
          $ref: '#/components/schemas/MerchantRiskInfo'
        reference:
          $ref: '#/components/schemas/Reference'
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        next_actions:
          $ref: '#/components/schemas/NextActions'
        ds:
          $ref: '#/components/schemas/Ds'
        acs:
          $ref: '#/components/schemas/Acs'
        response_code:
          $ref: '#/components/schemas/ResponseCode'
        response_status_reason:
          $ref: '#/components/schemas/ResponseStatusReason'
        cryptogram:
          $ref: '#/components/schemas/Cryptogram'
        eci:
          $ref: '#/components/schemas/Eci'
        xid:
          type: string
          description: The xid value to use for authorization
          example: XSUErNftqkiTdlkpSk8p32GWOFA
        cardholder_info:
          type: string
          description: May provide cardholder information from the DS to be presented to the cardholder
          example: Card declined. Please contact your issuing bank.
        card:
          $ref: '#/components/schemas/CardInfo'
        recurring:
          $ref: '#/components/schemas/Recurring'
        installment:
          $ref: '#/components/schemas/Installment'
        initial_transaction:
          $ref: '#/components/schemas/InitialTransaction'
        customer_ip:
          type: string
          description: 'Indicates the card holder''s IP address.       Only available when the scheme selected is Cartes Bancaires.

            '
