generated: '2026-07-14'
method: searched
source: https://www.checkout.com/docs/developer-resources/testing/test-cards
description: >-
  Checkout.com's sandbox / test-data surface — the test cards and magic values a
  developer uses to exercise the Payments API end-to-end without moving real
  money. Captured verbatim from the Checkout.com testing docs. Checkout.com
  separates test and live by environment host (api.sandbox.checkout.com vs
  api.checkout.com) and by key/prefix, not by a key literal like sk_test_. Each
  test card is bound to the API response_code it produces; set the card (and in
  some cases the amount) to simulate approvals, soft/hard declines, and 3DS
  outcomes. The sandbox stores payments for 30 days.
docs:
  - https://www.checkout.com/docs/developer-resources/testing/test-cards
  - https://www.checkout.com/docs/developer-resources/testing/payments-testing
  - https://www.checkout.com/docs/developer-resources/testing
  - https://www.checkout.com/docs/developer-resources/codes/api-response-codes

modes:
  - name: sandbox
    host: https://api.sandbox.checkout.com
    access_host: https://{prefix}.access.sandbox.checkout.com
    notes: >-
      Isolated test environment. Payments are stored for 30 days; a test payment
      flow must be completed within 30 days of creation. Never use real card
      details in the sandbox.
  - name: production
    host: https://api.checkout.com
    access_host: https://access.checkout.com

card_conventions:
  cvv: Any valid 3-digit CVV for Visa/Mastercard, or 4-digit for American Express.
  expiry: Any future date, in the format MM/YY or MM/YYYY.
  note: All cards on the test-cards page are also valid as network tokens.
  response_field: >-
    On a successful 2xx HTTP response the body carries a response_code field
    (e.g. "10000" approved, "20051" insufficient funds). See
    errors/checkout-com-decline-codes.yml.

# Default test cards — simulate a payment by card + response_code (verbatim).
